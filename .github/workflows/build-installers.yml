name: Build installers

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_release:
        description: Rebuild and replace all assets even when the release is complete
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    name: Release gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_build: ${{ steps.version.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify version alignment and release completeness
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_release == true }}
        run: |
          node scripts/check-version.mjs
          current_version="$(node -p "require('./package.json').version")"
          previous_version=""
          release_tag="v$current_version"
          required_assets=(
            "LMBrain_${current_version}_x64-setup.exe"
            "LMBrain_${current_version}_x64_en-US.msi"
            "LMBrain_${current_version}_amd64.AppImage"
            "LMBrain_${current_version}_amd64.deb"
            "lmbrain-mcp.exe"
            "lmbrain-mcp"
          )
          if git show HEAD^:package.json > "$RUNNER_TEMP/previous-package.json" 2>/dev/null; then
            previous_version="$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/previous-package.json')).version")"
          fi

          release_exists=false
          release_assets=""
          missing_assets=()
          if release_assets="$(gh release view "$release_tag" --json assets --jq '.assets[].name' 2>/dev/null)"; then
            release_exists=true
            for required_asset in "${required_assets[@]}"; do
              if ! grep -Fqx "$required_asset" <<< "$release_assets"; then
                missing_assets+=("$required_asset")
              fi
            done
          fi

          echo "version=$current_version" >> "$GITHUB_OUTPUT"
          if [ "$FORCE_RELEASE" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Force rebuild requested for LMBrain $release_tag."
          elif [ "$current_version" != "$previous_version" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Preparing LMBrain v$current_version (previous: ${previous_version:-none})."
          elif [ "$release_exists" != "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Release $release_tag does not exist; rebuilding installers."
          elif [ "${#missing_assets[@]}" -gt 0 ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Release $release_tag is incomplete; rebuilding missing asset set: ${missing_assets[*]}"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Release $release_tag already contains every expected asset; skipping installer build."
          fi

  build:
    needs: version
    if: needs.version.outputs.should_build == 'true'
    name: ${{ matrix.name }} installer
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --bundles nsis,msi
            artifact: |
              target/release/bundle/nsis/*.exe
              target/release/bundle/msi/*.msi
          - name: Linux
            os: ubuntu-22.04
            args: --bundles appimage,deb
            artifact: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: swatinem/rust-cache@v2
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify app and kit version alignment
        run: node scripts/check-version.mjs
      - name: Lint frontend
        run: pnpm lint
      - name: Test frontend
        run: pnpm test
      - name: Build MCP server
        run: cargo build --release -p lmbrain-mcp
      - name: Prepare MCP sidecar
        run: node scripts/prepare-sidecar.mjs --profile=release
      - name: Run Rust tests
        run: cargo test
      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          ARTIFACT_PATTERNS: ${{ matrix.artifact }}
        shell: pwsh
        run: |
          $tag = "v$env:VERSION"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "LMBrain v$env:VERSION" --generate-notes
            if ($LASTEXITCODE -ne 0) {
              gh release view $tag *> $null
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to create or find release $tag"
              }
            }
          }

          $assets = @()
          $patterns = $env:ARTIFACT_PATTERNS -split "`n" | ForEach-Object { $_.Trim() } | Where-Object { $_ }
          foreach ($pattern in $patterns) {
            $assets += Get-ChildItem -Path $pattern -File | ForEach-Object { $_.FullName }
          }

          $mcp = "target/release/lmbrain-mcp"
          if ($env:RUNNER_OS -eq "Windows") {
            $mcp = "$mcp.exe"
          }
          if (Test-Path $mcp) {
            $assets += (Resolve-Path $mcp).Path
          }

          if ($assets.Count -eq 0) {
            throw "No release assets found"
          }
          gh release upload $tag @assets --clobber
