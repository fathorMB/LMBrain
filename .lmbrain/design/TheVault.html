function getFileType(name, isFolder) {
  if (isFolder) return 'folder';
  const ext = name.split('.').pop().toLowerCase();
  if (['jpg','jpeg','png','gif','svg','webp','avif'].includes(ext)) return 'image';
  if (['mp4','mov','avi','mkv','webm'].includes(ext)) return 'video';
  if (['mp3','wav','flac','aac','ogg'].includes(ext)) return 'music';
  if (['js','ts','jsx','tsx','py','go','rs','html','css','json','md'].includes(ext)) return 'code';
  if (ext === 'pdf') return 'pdf';
  if (['zip','tar','gz','rar','7z'].includes(ext)) return 'zip';
  return 'file';
}

function fmtSize(bytes) {
  if (!bytes) return '—';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/(1024*1024)).toFixed(1) + ' MB';
}

function fmtDate(d) {
  const now = new Date('2026-04-23');
  const diff = now - d;
  const mins = diff/60000, hrs = diff/3600000, days = diff/86400000;
  if (mins < 2) return 'Just now';
  if (hrs < 1) return Math.floor(mins) + 'm ago';
  if (hrs < 24) return Math.floor(hrs) + 'h ago';
  if (days < 7) return Math.floor(days) + 'd ago';
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
}

    if (!password) { setError('Password is required'); return; }
    // Check against default or saved credentials
    const savedPwd = (() => { try { return localStorage.getItem('vault_password') || DEFAULT_PASSWORD; } catch { return DEFAULT_PASSWORD; } })();

      setLoading(true);
      setTimeout(() => { setLoading(false); setError('Invalid email or password.'); }, 900);
      return;

// ── CONTEXT MENU ────────────────────────────────────────────────────────────
function ContextMenu({ x, y, items, onClose }) {
  const ref = useRef();
  useEffect(() => {
    function handler(e) { if (ref.current && !ref.current.contains(e.target)) onClose(); }
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);

  // adjust if near edge
  const adjX = Math.min(x, window.innerWidth - 180);
  const adjY = Math.min(y, window.innerHeight - items.length * 36 - 16);

  return (
    <div ref={ref} style={{
      position:'fixed', left:adjX, top:adjY, zIndex:1000,
      background:'var(--surface2)', border:'1px solid var(--border2)',
      borderRadius:10, padding:'5px', minWidth:170,
      boxShadow:'0 12px 40px rgba(0,0,0,0.5)',
      animation:'scaleIn 0.12s ease both',
    }}>
      {items.map((item, i) => item === '---'
        ? <div key={i} style={{height:1, background:'var(--border)', margin:'4px 0'}}/>
        : <button
            key={i}
            onClick={() => { item.action(); onClose(); }}
            style={{
              display:'flex', alignItems:'center', gap:9,
              width:'100%', padding:'7px 10px', borderRadius:6,
              background:'none', border:'none', cursor:'pointer',
              color: item.danger ? 'var(--danger)' : 'var(--text)',
              fontSize:13, fontFamily:'var(--font-body)', textAlign:'left',
              transition:'background 0.1s',
            }}
            onMouseEnter={e=>e.currentTarget.style.background='var(--border)'}
            onMouseLeave={e=>e.currentTarget.style.background='none'}
          >
            <Icon name={item.icon} size={14} style={{color: item.danger ? 'var(--danger)' : 'var(--text-2)'}}/>
            {item.label}
          </button>
      )}
    </div>
  );
}

  const type = getFileType(file.name, file.folder);
  const color = FILE_COLORS[type];
  const [hover, setHover] = useState(false);
  const density = tweaks.compactDensity;

  return (
    <div
      onMouseEnter={()=>setHover(true)}

  const allDone = done === total;

  return (
    <div style={{
      position:'fixed', bottom:24, right:24, zIndex:500,
      background:'var(--surface2)', border:'1px solid var(--border2)',

        <div style={{ display:'flex', alignItems:'center', gap:8 }}>
          {!allDone && (
            <div style={{
              width:14, height:14, borderRadius:'50%',
              border:'2px solid var(--border2)',
              borderTopColor:'var(--accent)',
              animation:'spin 0.8s linear infinite', flexShrink:0,

          {allDone && (
            <div style={{ width:14, height:14, borderRadius:'50%', background:'oklch(0.65 0.18 145)', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
              <svg viewBox="0 0 10 10" width="8" height="8"><polyline points="2,5 4,7.5 8,3" fill="none" stroke="oklch(0.12 0.02 145)" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>
            </div>
          )}
          <span style={{ fontSize:13, fontWeight:500 }}>
            {allDone ? `${total} file caricati` : `Caricamento ${done}/${total}…`}
          </span>
        </div>
        {allDone && (
          <button onClick={onDismiss} style={{ background:'none', border:'none', cursor:'pointer', color:'var(--text-3)', display:'flex', padding:2, borderRadius:4 }}>
            <Icon name="x" size={13}/>
          </button>
        )}
      </div>
      {files.map((f, i) => (
        <div key={i} style={{ marginBottom: i < files.length - 1 ? 10 : 0 }}>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:5 }}>
            <span style={{ fontSize:12, color:'var(--text-2)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', maxWidth:190 }}>{f.name}</span>
            <div style={{ display:'flex', alignItems:'center', gap:6, flexShrink:0 }}>
              {f.algo && (
                <span style={{ fontSize:10, color:'var(--text-3)', fontFamily:'monospace', background:'var(--border)', padding:'1px 5px', borderRadius:3 }}>{f.algo}</span>
              )}
              <span style={{ fontSize:11, color: f.progress >= 100 ? 'oklch(0.65 0.18 145)' : 'var(--text-3)', fontFamily:'monospace' }}>
                {f.progress >= 100 ? '✓' : `${Math.round(f.progress)}%`}
              </span>
            </div>
          </div>
          <div style={{ height:2, background:'var(--border)', borderRadius:1, overflow:'hidden' }}>
            <div style={{
              height:'100%', borderRadius:1,
              width:`${f.progress}%`,
              background: f.progress >= 100 ? 'oklch(0.65 0.18 145)' : 'var(--accent)',
              transition:'width 0.25s ease',
            }}/>
          </div>
        </div>
      ))}
    </div>
  );
}

// ── COMPRESSION DIALOG ───────────────────────────────────────────────────────
const COMPRESSION_OPTION_META = {
  skip:     { label:'Nessuna compressione', color:'var(--text-3)',               speedDots:0 },
  fast:     { label:'Fast',                 color:'oklch(0.72 0.14 195)',        speedDots:1 },
  balanced: { label:'Balanced',             color:'var(--accent)',               speedDots:2 },
  max:      { label:'Maximum',              color:'oklch(0.72 0.14 25)',         speedDots:3 },
};

function CompressionDialog({ phase, fileInfo, onSelect, onCancel }) {
  const [selected, setSelected] = useState(null);
  const [hovered, setHovered]   = useState(null);

  // phase: 'analyzing' | 'skip' | 'options'
  const isAnalyzing = phase === 'analyzing';
  const isSkip      = phase === 'skip';

  return (
    <div style={{
      position:'fixed', inset:0, zIndex:600,
      background:'rgba(0,0,0,0.65)',
      display:'flex', alignItems:'center', justifyContent:'center',
      animation:'fadeIn 0.2s ease both',
      backdropFilter:'blur(4px)',
    }} onClick={e => { if (e.target === e.currentTarget && !isAnalyzing) onCancel(); }}>
      <div style={{
        background:'var(--surface)', border:'1px solid var(--border2)',
        borderRadius:16, width:460, maxWidth:'calc(100vw - 32px)',
        boxShadow:'0 24px 80px rgba(0,0,0,0.6)',
        animation:'scaleIn 0.22s cubic-bezier(0.22,1,0.36,1) both',
        overflow:'hidden',
      }}>

        {/* Header */}
        <div style={{ padding:'20px 22px 16px', borderBottom:'1px solid var(--border)', display:'flex', alignItems:'flex-start', justifyContent:'space-between' }}>
          <div>
            <div style={{ fontSize:15, fontWeight:700, fontFamily:'var(--font-display)', marginBottom:3 }}>
              {isAnalyzing ? 'Analisi in corso…' : isSkip ? 'File già ottimizzato' : 'Scegli compressione'}
            </div>
            {fileInfo && (
              <div style={{ display:'flex', alignItems:'center', gap:6, marginTop:4 }}>
                <span style={{ fontSize:12, color:'var(--text-2)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', maxWidth:280 }}>{fileInfo.filename}</span>
                <span style={{ fontSize:11, color:'var(--text-3)' }}>·</span>
                <span style={{ fontSize:11, color:'var(--text-3)', flexShrink:0 }}>{fileInfo.input_size_human}</span>
              </div>
            )}
          </div>
          {!isAnalyzing && (
            <button onClick={onCancel} style={{ background:'none', border:'none', cursor:'pointer', color:'var(--text-3)', display:'flex', padding:4, borderRadius:6, flexShrink:0, marginTop:-2 }}>
              <Icon name="x" size={15}/>
            </button>
          )}
        </div>

        {/* Body */}
        <div style={{ padding:'18px 22px 20px' }}>

          {/* Analyzing state */}
          {isAnalyzing && (
            <div style={{ display:'flex', flexDirection:'column', alignItems:'center', padding:'28px 0 16px', gap:14 }}>
              <div style={{
                width:36, height:36, borderRadius:'50%',
                border:'3px solid var(--border2)',
                borderTopColor:'var(--accent)',
                animation:'spin 0.9s linear infinite',
              }}/>
              <span style={{ fontSize:13, color:'var(--text-2)' }}>Analisi compressione…</span>
            </div>
          )}

          {/* Skip state */}
          {isSkip && (
            <div style={{ padding:'12px 0 8px' }}>
              <div style={{
                background:'oklch(0.65 0.14 78 / 0.08)', border:'1px solid oklch(0.65 0.14 78 / 0.2)',
                borderRadius:10, padding:'14px 16px', marginBottom:18,
                display:'flex', gap:12, alignItems:'flex-start',
              }}>
                <div style={{ color:'var(--accent)', flexShrink:0, marginTop:1 }}>
                  <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><circle cx="8" cy="8" r="6.5"/><line x1="8" y1="5.5" x2="8" y2="8.5"/><circle cx="8" cy="10.5" r="0.7" fill="currentColor" stroke="none"/></svg>
                </div>
                <span style={{ fontSize:13, color:'var(--text-2)', lineHeight:1.55 }}>
                  {fileInfo?.skip_reason || 'Questo file è già ottimizzato; la compressione non è necessaria.'}
                </span>
              </div>
              <div style={{ display:'flex', justifyContent:'flex-end', gap:10 }}>
                <button onClick={onCancel} style={{ padding:'9px 18px', background:'none', border:'1px solid var(--border2)', borderRadius:8, fontSize:13, color:'var(--text-2)', cursor:'pointer', fontFamily:'var(--font-body)' }}>Annulla</button>
                <button onClick={() => onSelect(null)} style={{ padding:'9px 18px', background:'var(--accent)', border:'none', borderRadius:8, fontSize:13, fontWeight:600, color:'oklch(0.12 0.02 78)', cursor:'pointer', fontFamily:'var(--font-body)' }}>Carica comunque</button>
              </div>
            </div>
          )}

          {/* Options state */}
          {!isAnalyzing && !isSkip && fileInfo?.options && (
            <div>
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8, marginBottom:18 }}>
                {fileInfo.options.map(opt => {
                  const meta   = COMPRESSION_OPTION_META[opt.id] || {};
                  const isSel  = selected === opt.id;
                  const isHov  = hovered  === opt.id;
                  const saving = opt.estimated_ratio > 1
                    ? `−${Math.round((1 - 1/opt.estimated_ratio) * 100)}%`
                    : null;

                  return (
                    <div
                      key={opt.id}
                      onClick={() => setSelected(opt.id)}
                      onMouseEnter={() => setHovered(opt.id)}
                      onMouseLeave={() => setHovered(null)}
                      style={{
                        border: isSel
                          ? `1.5px solid ${meta.color}`
                          : `1px solid ${isHov ? 'var(--border2)' : 'var(--border)'}`,
                        borderRadius:10, padding:'13px 14px', cursor:'pointer',
                        background: isSel ? `${meta.color}12` : isHov ? 'var(--surface2)' : 'transparent',
                        transition:'all 0.15s',
                        position:'relative',
                      }}
                    >
                      {isSel && (
                        <div style={{
                          position:'absolute', top:10, right:10,
                          width:14, height:14, borderRadius:'50%',
                          background: meta.color,
                          display:'flex', alignItems:'center', justifyContent:'center',
                        }}>
                          <svg viewBox="0 0 10 10" width="8" height="8"><polyline points="2,5 4,7.5 8,3" fill="none" stroke="oklch(0.12 0.02 78)" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>
                        </div>
                      )}

                      <div style={{ fontSize:11, fontWeight:600, color: meta.color, textTransform:'uppercase', letterSpacing:'0.06em', marginBottom:6 }}>
                        {meta.label}
                      </div>

                      {opt.algorithm && (
                        <div style={{ fontSize:11, color:'var(--text-3)', fontFamily:'monospace', marginBottom:8 }}>
                          {opt.algorithm} · lv{opt.level}
                        </div>
                      )}

                      <div style={{ marginBottom:opt.id !== 'skip' ? 8 : 0 }}>
                        <span style={{ fontSize:14, fontWeight:700, color:'var(--text)' }}>{opt.estimated_size_human || fileInfo.input_size_human}</span>
                        {saving && <span style={{ fontSize:11, color: meta.color, marginLeft:6 }}>{saving}</span>}
                      </div>

                      {opt.id !== 'skip' && (
                        <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                          <div style={{ display:'flex', gap:3 }}>
                            {[1,2,3].map(d => (
                              <div key={d} style={{
                                width:5, height:5, borderRadius:'50%',
                                background: d <= meta.speedDots ? meta.color : 'var(--border)',
                                transition:'background 0.1s',
                              }}/>
                            ))}
                          </div>
                          <span style={{ fontSize:11, color:'var(--text-3)' }}>{opt.time_estimate}</span>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>

              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                <div style={{ fontSize:12, color:'var(--text-3)' }}>
                  {selected
                    ? (() => {
                        const o = fileInfo.options.find(x => x.id === selected);
                        return o?.algorithm ? `Algoritmo: ${o.algorithm} — ${o.time_estimate}` : 'Nessuna compressione applicata';
                      })()
                    : 'Seleziona un\'opzione'}
                </div>
                <div style={{ display:'flex', gap:10 }}>
                  <button onClick={onCancel} style={{ padding:'9px 16px', background:'none', border:'1px solid var(--border2)', borderRadius:8, fontSize:13, color:'var(--text-2)', cursor:'pointer', fontFamily:'var(--font-body)' }}>Annulla</button>
                  <button
                    onClick={() => selected && onSelect(fileInfo.options.find(x => x.id === selected))}
                    disabled={!selected}
                    style={{
                      padding:'9px 20px',
                      background: selected ? 'var(--accent)' : 'var(--border)',
                      border:'none', borderRadius:8, fontSize:13, fontWeight:600,
                      color: selected ? 'oklch(0.12 0.02 78)' : 'var(--text-3)',
                      cursor: selected ? 'pointer' : 'not-allowed',
                      fontFamily:'var(--font-body)',
                      transition:'all 0.15s',
                    }}
                  >
                    Carica
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ── DETAIL PANEL ─────────────────────────────────────────────────────────────
function DetailPanel({ file, onClose, onCompress }) {
  const type = getFileType(file.name, file.folder);
  const color = FILE_COLORS[type];

  return (
    <div style={{
      width:280, flexShrink:0, borderLeft:'1px solid var(--border)',
      background:'var(--surface)', display:'flex', flexDirection:'column',
      animation:'slideRight 0.2s ease both',
    }}>
      {/* Header */}
      <div style={{ padding:'18px 18px 14px', borderBottom:'1px solid var(--border)', display:'flex', alignItems:'center', justifyContent:'space-between' }}>
        <span style={{ fontSize:13, fontWeight:600 }}>Info</span>
        <button onClick={onClose} style={{ background:'none',border:'none',cursor:'pointer',color:'var(--text-3)',display:'flex',alignItems:'center',padding:4,borderRadius:4 }}>
          <Icon name="x" size={14}/>
        </button>
      </div>

      {/* Preview area */}
      <div style={{ padding:'24px 18px 18px', borderBottom:'1px solid var(--border)' }}>
        <div style={{
          width:'100%', aspectRatio:'1', borderRadius:14,
          background:`${color}0e`, border:`1px solid ${color}20`,
          display:'flex', alignItems:'center', justifyContent:'center',
          color, marginBottom:16,
        }}>
          <Icon name={type} size={48}/>
        </div>
        <div style={{ fontSize:14, fontWeight:600, marginBottom:4, wordBreak:'break-word' }}>{file.name}</div>
        <div style={{ fontSize:12, color:'var(--text-3)' }}>{file.folder ? 'Folder' : fmtSize(file.size)}</div>
      </div>

      {/* Meta */}
      <div style={{ padding:'16px 18px', flex:1, overflowY:'auto' }}>
        {[
          { label:'Type', value: file.folder ? 'Folder' : type.charAt(0).toUpperCase()+type.slice(1) },
          { label:'Modified', value: file.modified.toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' }) },
          { label:'Size', value: file.folder ? '—' : fmtSize(file.size) },
          { label:'Starred', value: file.starred ? 'Yes' : 'No' },
        ].map(({ label, value }) => (
          <div key={label} style={{ marginBottom:14 }}>
            <div style={{ fontSize:11, color:'var(--text-3)', textTransform:'uppercase', letterSpacing:'0.05em', marginBottom:3 }}>{label}</div>
            <div style={{ fontSize:13, color:'var(--text-2)' }}>{value}</div>
          </div>
        ))}
      </div>

      {/* Actions */}
      <div style={{ padding:'14px 18px', borderTop:'1px solid var(--border)', display:'flex', flexDirection:'column', gap:8 }}>
        {[
          { icon:'download', label:'Download' },
          { icon:'share', label:'Share Link' },
          { icon:'rename', label:'Rename' },
        ].map(btn => (
          <button key={btn.icon} style={{
            display:'flex', alignItems:'center', gap:9, padding:'9px 12px',
            background:'var(--surface2)', border:'1px solid var(--border)',
            borderRadius:8, cursor:'pointer', fontSize:13, color:'var(--text)',
            fontFamily:'var(--font-body)', transition:'border-color 0.15s',
          }}
          onMouseEnter={e=>e.currentTarget.style.borderColor='var(--border2)'}
          onMouseLeave={e=>e.currentTarget.style.borderColor='var(--border)'}
          >
            <Icon name={btn.icon} size={14} style={{color:'var(--text-2)'}}/>
            {btn.label}
          </button>
        ))}

        {/* Compress — solo per file non-directory */}
        {!file.folder && (
          <button
            onClick={() => onCompress && onCompress(file)}
            style={{
              display:'flex', alignItems:'center', gap:9, padding:'9px 12px',
              background:'oklch(0.65 0.14 290 / 0.08)',
              border:'1px solid oklch(0.65 0.14 290 / 0.28)',
              borderRadius:8, cursor:'pointer', fontSize:13,
              color:'oklch(0.75 0.12 290)',
              fontFamily:'var(--font-body)', transition:'all 0.15s',
            }}
            onMouseEnter={e=>{ e.currentTarget.style.background='oklch(0.65 0.14 290 / 0.14)'; e.currentTarget.style.borderColor='oklch(0.65 0.14 290 / 0.55)'; }}
            onMouseLeave={e=>{ e.currentTarget.style.background='oklch(0.65 0.14 290 / 0.08)'; e.currentTarget.style.borderColor='oklch(0.65 0.14 290 / 0.28)'; }}
          >
            <Icon name="squeeze" size={14} style={{color:'oklch(0.65 0.14 290)'}}/>
            Compress
          </button>
        )}
      </div>
    </div>
  );
}

// ── MULTI-FILE COMPRESS DIALOG ───────────────────────────────────────────────
const MULTI_COMPRESS_OPTIONS = [
  { id:'skip',     label:'Nessuna', color:'var(--text-3)',         speedDots:0, ratio:1.0,  timeEst:'instant' },
  { id:'fast',     label:'Fast',    color:'oklch(0.72 0.14 195)', speedDots:1, ratio:1.15, timeEst:'~80ms'   },
  { id:'balanced', label:'Balanced',color:'var(--accent)',         speedDots:2, ratio:1.35, timeEst:'~400ms'  },
  { id:'max',      label:'Max',     color:'oklch(0.72 0.14 25)',  speedDots:3, ratio:1.55, timeEst:'~12s'    },
];

function MultiCompressDialog({ files, onConfirm, onCancel }) {
  // analyzing: Set of file ids still being analyzed
  const [analyzing, setAnalyzing] = useState(() => new Set(files.map(f => f.id)));
  // perFile: { [fileId]: optionId | null }
  const [perFile, setPerFile] = useState(() => Object.fromEntries(files.map(f => [f.id, null])));

  // Staggered analyze simulation
  useEffect(() => {
    files.forEach((f, i) => {
      setTimeout(() => {
        setAnalyzing(prev => { const s = new Set(prev); s.delete(f.id); return s; });
        // Auto-suggest 'balanced' as default
        setPerFile(prev => ({ ...prev, [f.id]: 'balanced' }));
      }, 400 + i * 300);
    });
  }, []);

  const VIOLET = 'oklch(0.65 0.14 290)';
  const allDone = analyzing.size === 0;
  const canConfirm = allDone && Object.values(perFile).some(v => v && v !== 'skip');

  return (
    <div
      style={{ position:'fixed', inset:0, zIndex:650, background:'rgba(0,0,0,0.7)', display:'flex', alignItems:'center', justifyContent:'center', animation:'fadeIn 0.2s ease both', backdropFilter:'blur(4px)' }}
      onClick={e => e.target === e.currentTarget && onCancel()}
    >
      <div style={{ background:'var(--surface)', border:'1px solid var(--border2)', borderRadius:16, width:520, maxWidth:'calc(100vw - 32px)', maxHeight:'calc(100vh - 64px)', display:'flex', flexDirection:'column', boxShadow:'0 24px 80px rgba(0,0,0,0.65)', animation:'scaleIn 0.22s cubic-bezier(0.22,1,0.36,1) both', overflow:'hidden' }}>

        {/* Header */}
        <div style={{ padding:'20px 22px 16px', borderBottom:'1px solid var(--border)', display:'flex', alignItems:'center', justifyContent:'space-between', flexShrink:0 }}>
          <div>
            <div style={{ fontSize:15, fontWeight:700, fontFamily:'var(--font-display)', marginBottom:3 }}>Comprimi {files.length} file</div>
            <div style={{ fontSize:12, color:'var(--text-3)' }}>Scegli l'algoritmo per ogni file. I file impostati su "Skip" non verranno modificati.</div>
          </div>
          <button onClick={onCancel} style={{ background:'none', border:'none', cursor:'pointer', color:'var(--text-3)', display:'flex', padding:4, borderRadius:6, flexShrink:0 }}>
            <Icon name="x" size={15}/>
          </button>
        </div>

        {/* File list */}
        <div style={{ flex:1, overflowY:'auto', padding:'14px 22px', display:'flex', flexDirection:'column', gap:10 }}>
          {files.map((file, idx) => {
            const isAnalyzing = analyzing.has(file.id);
            const chosen = perFile[file.id];
            const type = getFileType(file.name, false);
            const fileColor = FILE_COLORS[type] || 'var(--text-3)';

            return (
              <div key={file.id} style={{ background:'var(--surface2)', border:'1px solid var(--border)', borderRadius:12, padding:'14px 16px', animation:`fadeUp 0.3s ${idx * 0.05}s ease both` }}>
                {/* File info row */}
                <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom: isAnalyzing ? 0 : 12 }}>
                  <div style={{ width:28, height:28, borderRadius:7, background:`${fileColor}12`, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
                    <Icon name={type} size={14} style={{ color: fileColor }}/>
                  </div>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontSize:13, fontWeight:500, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{file.name}</div>
                    <div style={{ fontSize:11, color:'var(--text-3)' }}>{file.size ? fmtSize(file.size) : '—'}</div>
                  </div>
                  {/* Chosen badge */}
                  {!isAnalyzing && chosen && (
                    <span style={{ fontSize:10, fontWeight:600, letterSpacing:'0.05em', textTransform:'uppercase', color: MULTI_COMPRESS_OPTIONS.find(o=>o.id===chosen)?.color || 'var(--text-3)', background: chosen === 'skip' ? 'var(--surface)' : `${MULTI_COMPRESS_OPTIONS.find(o=>o.id===chosen)?.color}14`, border:`1px solid ${MULTI_COMPRESS_OPTIONS.find(o=>o.id===chosen)?.color}40`, borderRadius:4, padding:'2px 7px', flexShrink:0 }}>
                      {MULTI_COMPRESS_OPTIONS.find(o=>o.id===chosen)?.label}
                    </span>
                  )}
                  {/* Analyzing spinner */}
                  {isAnalyzing && (
                    <div style={{ width:14, height:14, borderRadius:'50%', border:'2px solid var(--border2)', borderTopColor:'var(--accent)', animation:'spin 0.8s linear infinite', flexShrink:0 }}/>
                  )}
                </div>

                {/* Option pills (visible after analyze) */}
                {!isAnalyzing && (
                  <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:6 }}>
                    {MULTI_COMPRESS_OPTIONS.map(opt => {
                      const isSel = chosen === opt.id;
                      const estSize = file.size ? Math.round(file.size / opt.ratio) : null;
                      const saving  = opt.ratio > 1 && file.size
                        ? `−${Math.round((1 - 1/opt.ratio) * 100)}%`
                        : null;
                      return (
                        <button
                          key={opt.id}
                          onClick={() => setPerFile(prev => ({ ...prev, [file.id]: opt.id }))}
                          style={{
                            padding:'8px 6px', borderRadius:8,
                            border: isSel ? `1.5px solid ${opt.color}` : '1px solid var(--border)',
                            background: isSel ? `${opt.color}14` : 'var(--surface)',
                            cursor:'pointer', fontFamily:'var(--font-body)',
                            display:'flex', flexDirection:'column', alignItems:'center', gap:3,
                            transition:'all 0.12s', textAlign:'center',
                          }}
                        >
                          <span style={{ fontSize:10, fontWeight:700, color: isSel ? opt.color : 'var(--text-3)', textTransform:'uppercase', letterSpacing:'0.04em' }}>{opt.label}</span>
                          {estSize !== null && (
                            <span style={{ fontSize:11, fontWeight:600, color: isSel ? opt.color : 'var(--text-2)' }}>
                              {fmtSize(estSize)}
                            </span>
                          )}
                          {saving && (
                            <span style={{ fontSize:10, color: isSel ? opt.color : 'var(--text-3)' }}>{saving}</span>
                          )}
                          {opt.speedDots > 0 ? (
                            <div style={{ display:'flex', gap:2, marginTop:1 }}>
                              {[1,2,3].map(d => (
                                <div key={d} style={{ width:4, height:4, borderRadius:'50%', background: d <= opt.speedDots ? (isSel ? opt.color : 'var(--border2)') : 'var(--border)' }}/>
                              ))}
                            </div>
                          ) : (
                            <div style={{ height:6 }}/>
                          )}
                          <span style={{ fontSize:9, color:'var(--text-3)' }}>{opt.timeEst}</span>
                        </button>
                      );
                    })}
                  </div>
                )}
              </div>
            );
          })}
        </div>

        {/* Footer */}
        <div style={{ padding:'14px 22px', borderTop:'1px solid var(--border)', display:'flex', justifyContent:'space-between', alignItems:'center', flexShrink:0 }}>
          <div style={{ fontSize:12, color:'var(--text-3)' }}>
            {!allDone
              ? `Analisi in corso… (${analyzing.size} rimasti)`
              : `${Object.values(perFile).filter(v => v && v !== 'skip').length} file da comprimere`
            }
          </div>
          <div style={{ display:'flex', gap:10 }}>
            <button onClick={onCancel} style={{ padding:'9px 18px', background:'none', border:'1px solid var(--border2)', borderRadius:8, fontSize:13, color:'var(--text-2)', cursor:'pointer', fontFamily:'var(--font-body)' }}>Annulla</button>
            <button
              onClick={() => canConfirm && onConfirm(perFile)}
              disabled={!canConfirm}
              style={{ padding:'9px 20px', background: canConfirm ? VIOLET : 'var(--border)', border:'none', borderRadius:8, fontSize:13, fontWeight:600, color: canConfirm ? 'white' : 'var(--text-3)', cursor: canConfirm ? 'pointer' : 'not-allowed', fontFamily:'var(--font-body)', transition:'all 0.15s' }}
            >
              Comprimi {canConfirm ? Object.values(perFile).filter(v=>v&&v!=='skip').length : ''} file
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── CHANGE PASSWORD SCREEN ───────────────────────────────────────────────────
function ChangePasswordScreen({ onDone }) {
  const [newPwd, setNewPwd] = useState('');
  const [confirmPwd, setConfirmPwd] = useState('');
  const [showNew, setShowNew] = useState(false);
  const [showConfirm, setShowConfirm] = useState(false);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [mounted, setMounted] = useState(false);

  useEffect(() => { setTimeout(() => setMounted(true), 50); }, []);

  // Strength calculation
  function getStrength(pwd) {
    if (!pwd) return { score: 0, label: '', color: 'transparent' };
    let score = 0;
    if (pwd.length >= 8)  score++;
    if (pwd.length >= 12) score++;
    if (/[A-Z]/.test(pwd)) score++;
    if (/[0-9]/.test(pwd)) score++;
    if (/[^A-Za-z0-9]/.test(pwd)) score++;
    if (score <= 1) return { score, label:'Weak', color:'var(--danger)' };
    if (score <= 2) return { score, label:'Fair', color:'oklch(0.72 0.18 55)' };
    if (score <= 3) return { score, label:'Good', color:'oklch(0.72 0.14 78)' };
    return { score, label:'Strong', color:'oklch(0.65 0.18 145)' };
  }

  const strength = getStrength(newPwd);
  const rules = [
    { ok: newPwd.length >= 8,           text: 'At least 8 characters' },
    { ok: /[A-Z]/.test(newPwd),         text: 'One uppercase letter' },
    { ok: /[0-9]/.test(newPwd),         text: 'One number' },
    { ok: /[^A-Za-z0-9]/.test(newPwd),  text: 'One special character' },
  ];

  function handleSubmit(e) {
    e.preventDefault();
    setError('');
    if (newPwd.length < 8) { setError('Password must be at least 8 characters.'); return; }
    if (newPwd === DEFAULT_PASSWORD) { setError('New password cannot be the same as the default.'); return; }
    if (newPwd !== confirmPwd) { setError('Passwords do not match.'); return; }
    setLoading(true);
    setTimeout(() => {
      try { localStorage.setItem('vault_password', newPwd); localStorage.setItem('vault_pwd_changed', '1'); } catch {}
      setLoading(false);
      onDone();
    }, 1000);
  }

  const delay = (n) => ({ animationDelay: `${n}ms` });

  return (
    <div style={{ width:'100%', height:'100%', display:'flex', alignItems:'center', justifyContent:'center', background:'var(--bg)', position:'relative', overflow:'hidden' }}>
      {/* Ambient orbs */}
      <div style={{ position:'absolute', top:'-10%', right:'-5%', width:500, height:500, borderRadius:'50%', background:'radial-gradient(circle, oklch(0.72 0.14 78 / 0.05) 0%, transparent 70%)', pointerEvents:'none' }}/>
      <div style={{ position:'absolute', bottom:'-15%', left:'-5%', width:500, height:500, borderRadius:'50%', background:'radial-gradient(circle, oklch(0.60 0.12 260 / 0.05) 0%, transparent 70%)', pointerEvents:'none' }}/>

      <div style={{ width:'100%', maxWidth:420, padding:'0 24px' }}>
        {/* Header */}
        <div className={mounted ? 'anim-fadeup' : ''} style={{ textAlign:'center', marginBottom:36, ...delay(0) }}>
          {/* Shield icon */}
          <div style={{
            width:56, height:56, borderRadius:16, margin:'0 auto 20px',
            background:'var(--accent-dim)', border:'1px solid oklch(0.72 0.14 78 / 0.3)',
            display:'flex', alignItems:'center', justifyContent:'center', color:'var(--accent)',
          }}>
            <Icon name="lock" size={26}/>
          </div>
          <h1 style={{ fontFamily:'var(--font-display)', fontSize:24, fontWeight:700, letterSpacing:'-0.02em', marginBottom:8 }}>
            Set your password
          </h1>
          <p style={{ fontSize:14, color:'var(--text-2)', lineHeight:1.6, maxWidth:320, margin:'0 auto' }}>
            This is your first access. Choose a strong password to secure your vault — you won't be able to skip this step.
          </p>
        </div>

        {/* Card */}
        <div className={mounted ? 'anim-fadeup' : ''} style={{
          background:'var(--surface)', border:'1px solid var(--border)',
          borderRadius:14, padding:'28px', ...delay(80),
        }}>
          <form onSubmit={handleSubmit}>
            {/* New password */}
            <div style={{ marginBottom:16 }}>
              <label style={{ display:'block', fontSize:12, fontWeight:500, color:'var(--text-2)', marginBottom:7, letterSpacing:'0.03em', textTransform:'uppercase' }}>New Password</label>
              <div style={{ position:'relative' }}>
                <input
                  type={showNew ? 'text' : 'password'}
                  value={newPwd}
                  onChange={e=>setNewPwd(e.target.value)}
                  placeholder="Choose a strong password"
                  autoFocus
                  style={{
                    width:'100%', padding:'11px 42px 11px 14px',
                    background:'var(--surface2)', border:'1px solid var(--border)',
                    borderRadius:8, fontSize:14, color:'var(--text)',
                    outline:'none', transition:'border-color 0.15s', fontFamily:'var(--font-body)',
                  }}
                  onFocus={e=>e.target.style.borderColor='var(--accent)'}
                  onBlur={e=>e.target.style.borderColor='var(--border)'}
                />
                <button type="button" onClick={()=>setShowNew(v=>!v)} style={{ position:'absolute', right:12, top:'50%', transform:'translateY(-50%)', background:'none', border:'none', cursor:'pointer', color:'var(--text-3)', display:'flex', padding:2 }}>
                  <Icon name={showNew ? 'eye' : 'eyeOff'} size={15}/>
                </button>
              </div>

              {/* Strength bar */}
              {newPwd.length > 0 && (
                <div style={{ marginTop:10 }}>
                  <div style={{ display:'flex', gap:4, marginBottom:6 }}>
                    {[1,2,3,4].map(i => (
                      <div key={i} style={{
                        flex:1, height:3, borderRadius:2,
                        background: i <= strength.score ? strength.color : 'var(--border2)',
                        transition:'background 0.3s',
                      }}/>
                    ))}
                  </div>
                  <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                    <div style={{ display:'flex', flexDirection:'column', gap:3 }}>
                      {rules.map((r,i) => (
                        <div key={i} style={{ display:'flex', alignItems:'center', gap:5, fontSize:11, color: r.ok ? 'var(--text-2)' : 'var(--text-3)', transition:'color 0.2s' }}>
                          <Icon name={r.ok ? 'check' : 'x'} size={10} style={{ color: r.ok ? 'oklch(0.65 0.18 145)' : 'var(--text-3)', transition:'color 0.2s' }}/>
                          {r.text}
                        </div>
                      ))}
                    </div>
                    <span style={{ fontSize:12, fontWeight:600, color: strength.color, transition:'color 0.3s', alignSelf:'flex-start' }}>{strength.label}</span>
                  </div>
                </div>
              )}
            </div>

            {/* Confirm password */}
            <div style={{ marginBottom: error ? 14 : 22 }}>
              <label style={{ display:'block', fontSize:12, fontWeight:500, color:'var(--text-2)', marginBottom:7, letterSpacing:'0.03em', textTransform:'uppercase' }}>Confirm Password</label>
              <div style={{ position:'relative' }}>
                <input
                  type={showConfirm ? 'text' : 'password'}
                  value={confirmPwd}
                  onChange={e=>setConfirmPwd(e.target.value)}
                  placeholder="Repeat your password"
                  style={{
                    width:'100%', padding:'11px 42px 11px 14px',
                    background:'var(--surface2)',
                    border:`1px solid ${confirmPwd && confirmPwd !== newPwd ? 'oklch(0.65 0.18 25 / 0.5)' : confirmPwd && confirmPwd === newPwd ? 'oklch(0.65 0.18 145 / 0.5)' : 'var(--border)'}`,
                    borderRadius:8, fontSize:14, color:'var(--text)',
                    outline:'none', transition:'border-color 0.15s', fontFamily:'var(--font-body)',
                  }}
                  onFocus={e=>{ if(!confirmPwd) e.target.style.borderColor='var(--accent)'; }}
                  onBlur={e=>{ if(!confirmPwd) e.target.style.borderColor='var(--border)'; }}
                />
                <button type="button" onClick={()=>setShowConfirm(v=>!v)} style={{ position:'absolute', right:12, top:'50%', transform:'translateY(-50%)', background:'none', border:'none', cursor:'pointer', color:'var(--text-3)', display:'flex', padding:2 }}>
                  <Icon name={showConfirm ? 'eye' : 'eyeOff'} size={15}/>
                </button>
                {confirmPwd && confirmPwd === newPwd && (
                  <div style={{ position:'absolute', right:40, top:'50%', transform:'translateY(-50%)', color:'oklch(0.65 0.18 145)' }}>
                    <Icon name="check" size={14}/>
                  </div>
                )}
              </div>
            </div>

            {/* Error */}
            {error && (
              <div style={{ padding:'9px 12px', borderRadius:7, marginBottom:16, background:'oklch(0.65 0.18 25 / 0.1)', border:'1px solid oklch(0.65 0.18 25 / 0.25)', fontSize:13, color:'var(--danger)', display:'flex', alignItems:'center', gap:8 }}>
                <Icon name="info" size={14}/>
                {error}
              </div>
            )}

            <button
              type="submit"
              disabled={loading}
              style={{
                width:'100%', padding:'12px',
                background: loading ? 'var(--surface2)' : 'var(--accent)',
                color: loading ? 'var(--text-3)' : 'oklch(0.12 0.02 78)',
                border:'none', borderRadius:8, fontSize:14, fontWeight:600,
                cursor: loading ? 'default' : 'pointer',
                fontFamily:'var(--font-body)', transition:'all 0.2s',
                display:'flex', alignItems:'center', justifyContent:'center', gap:8,
              }}
            >
              {loading
                ? <><div style={{width:14,height:14,border:'2px solid var(--text-3)',borderTopColor:'transparent',borderRadius:'50%',animation:'spin 0.6s linear infinite'}}/>Saving password…</>
                : <><Icon name="lock" size={14} style={{color:'oklch(0.12 0.02 78)'}}/>Set Password & Enter Vault</>
              }
            </button>
          </form>
        </div>

        <div className={mounted ? 'anim-fadeup' : ''} style={{ textAlign:'center', marginTop:20, fontSize:12, color:'var(--text-3)', ...delay(160) }}>
          TheVault v2.4 · Self-hosted instance
        </div>
      </div>
    </div>
  );
}

// ── SETUP WIZARD ─────────────────────────────────────────────────────────────
function SetupWizard({ onDone }) {
  const [step, setStep] = useState(0);
  const [mounted, setMounted] = useState(false);
  const [animDir, setAnimDir] = useState(1); // 1=forward, -1=back

  // Step 1 state
  const [vaultName, setVaultName] = useState('');

  // Step 2 state
  const [sinks, setSinks] = useState([{ id: Date.now(), path: '', label: '' }]);

  // Step 3 state
  const [squeezeMode, setSqueezeMode] = useState(false);

  useEffect(() => { setTimeout(() => setMounted(true), 50); }, []);

  const STEPS = [
    { id: 'name',    label: 'Vault Name',   icon: 'vault'     },
    { id: 'sinks',   label: 'File Sinks',   icon: 'folder'    },
    { id: 'engine',  label: 'Engine',       icon: 'settings'  },
    { id: 'summary', label: 'Review',       icon: 'check'     },
  ];

  function goTo(n) {
    setAnimDir(n > step ? 1 : -1);
    setStep(n);
  }

  function addSink() {
    setSinks(s => [...s, { id: Date.now(), path: '', label: '' }]);
  }

  function removeSink(id) {
    setSinks(s => s.filter(x => x.id !== id));
  }

  function updateSink(id, field, value) {
    setSinks(s => s.map(x => x.id === id ? { ...x, [field]: value } : x));
  }

  function canNext() {
    if (step === 0) return vaultName.trim().length >= 2;
    if (step === 1) return sinks.length > 0 && sinks.every(s => s.path.trim().length > 0);
    return true;
  }

  function handleFinish() {
    const config = { vaultName: vaultName.trim(), sinks, squeezeMode };
    try { localStorage.setItem('vault_config', JSON.stringify(config)); } catch {}
    onDone(config);
  }

  const delay = n => ({ animationDelay: `${n}ms` });

  // Shared input style
  const inputStyle = {
    width: '100%', padding: '11px 14px',
    background: 'var(--surface2)', border: '1px solid var(--border)',
    borderRadius: 8, fontSize: 14, color: 'var(--text)',
    outline: 'none', transition: 'border-color 0.15s', fontFamily: 'var(--font-body)',
  };

  return (
    <div style={{ width:'100%', height:'100%', display:'flex', alignItems:'center', justifyContent:'center', background:'var(--bg)', position:'relative', overflow:'hidden' }}>
      {/* Ambient orb */}
      <div style={{ position:'absolute', top:'-10%', left:'50%', transform:'translateX(-50%)', width:700, height:700, borderRadius:'50%', background:'radial-gradient(circle, oklch(0.72 0.14 78 / 0.04) 0%, transparent 65%)', pointerEvents:'none' }}/>

      <div style={{ width:'100%', maxWidth:540, padding:'0 24px' }}>

        {/* Progress header */}
        <div className={mounted ? 'anim-fadeup' : ''} style={{ marginBottom:36, ...delay(0) }}>
          <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:20, justifyContent:'center' }}>
            <div style={{ color:'var(--accent)' }}><VaultMark size={20}/></div>
            <span style={{ fontFamily:'var(--font-display)', fontSize:15, fontWeight:700, letterSpacing:'-0.02em' }}>Vault Setup</span>
          </div>
          {/* Step indicators */}
          <div style={{ display:'flex', alignItems:'center', justifyContent:'center', gap:0 }}>
            {STEPS.map((s, i) => (
              <React.Fragment key={s.id}>
                <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:6 }}>
                  <div style={{
                    width:32, height:32, borderRadius:'50%',
                    border:`2px solid ${i < step ? 'oklch(0.65 0.18 145)' : i === step ? 'var(--accent)' : 'var(--border2)'}`,
                    background: i < step ? 'oklch(0.65 0.18 145 / 0.15)' : i === step ? 'var(--accent-dim)' : 'transparent',
                    display:'flex', alignItems:'center', justifyContent:'center',
                    color: i < step ? 'oklch(0.65 0.18 145)' : i === step ? 'var(--accent)' : 'var(--text-3)',
                    transition:'all 0.3s',
                  }}>
                    {i < step
                      ? <Icon name="check" size={14}/>
                      : <span style={{ fontSize:12, fontWeight:600 }}>{i+1}</span>
                    }
                  </div>
                  <span style={{ fontSize:10, color: i === step ? 'var(--text-2)' : 'var(--text-3)', letterSpacing:'0.04em', textTransform:'uppercase', fontWeight: i===step ? 600 : 400 }}>{s.label}</span>
                </div>
                {i < STEPS.length - 1 && (
                  <div style={{ width:52, height:2, marginBottom:18, background: i < step ? 'oklch(0.65 0.18 145 / 0.5)' : 'var(--border)', transition:'background 0.3s', flexShrink:0 }}/>
                )}
              </React.Fragment>
            ))}
          </div>
        </div>

        {/* Card */}
        <div className={mounted ? 'anim-fadeup' : ''} style={{
          background:'var(--surface)', border:'1px solid var(--border)',
          borderRadius:16, overflow:'hidden', ...delay(80),
        }}>

          {/* Step 0 — Vault Name */}
          {step === 0 && (
            <div style={{ padding:'32px 32px 28px', animation:'fadeIn 0.25s ease both' }}>
              <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:6 }}>
                <div style={{ width:36, height:36, borderRadius:10, background:'var(--accent-dim)', border:'1px solid oklch(0.72 0.14 78 / 0.25)', display:'flex', alignItems:'center', justifyContent:'center', color:'var(--accent)', flexShrink:0 }}>
                  <Icon name="vault" size={18}/>
                </div>
                <h2 style={{ fontFamily:'var(--font-display)', fontSize:20, fontWeight:700, letterSpacing:'-0.02em' }}>Name your vault</h2>
              </div>
              <p style={{ fontSize:13, color:'var(--text-3)', marginBottom:28, marginLeft:46, lineHeight:1.55 }}>
                This name will appear in the header of your workspace.
              </p>
              <label style={{ display:'block', fontSize:12, fontWeight:500, color:'var(--text-2)', marginBottom:8, letterSpacing:'0.03em', textTransform:'uppercase' }}>Vault Name</label>
              <input
                autoFocus
                value={vaultName}
                onChange={e => setVaultName(e.target.value)}
                placeholder="e.g. My Personal Vault, Acme Files…"
                style={inputStyle}
                onFocus={e=>e.target.style.borderColor='var(--accent)'}
                onBlur={e=>e.target.style.borderColor='var(--border)'}
              />
              {vaultName.trim().length > 0 && (
                <div style={{ marginTop:14, padding:'10px 14px', borderRadius:8, background:'var(--surface2)', border:'1px solid var(--border)', display:'flex', alignItems:'center', gap:10 }}>
                  <div style={{ color:'var(--accent)' }}><VaultMark size={16}/></div>
                  <span style={{ fontFamily:'var(--font-display)', fontSize:14, fontWeight:700, letterSpacing:'-0.02em' }}>{vaultName.trim()}</span>
                  <span style={{ fontSize:11, color:'var(--text-3)', marginLeft:4 }}>— preview</span>
                </div>
              )}
            </div>
          )}

          {/* Step 1 — Sinks */}
          {step === 1 && (
            <div style={{ padding:'32px 32px 28px', animation:'fadeIn 0.25s ease both' }}>
              <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:6 }}>
                <div style={{ width:36, height:36, borderRadius:10, background:'oklch(0.65 0.14 200 / 0.12)', border:'1px solid oklch(0.65 0.14 200 / 0.25)', display:'flex', alignItems:'center', justifyContent:'center', color:'oklch(0.65 0.14 200)', flexShrink:0 }}>
                  <Icon name="folder" size={18}/>
                </div>
                <h2 style={{ fontFamily:'var(--font-display)', fontSize:20, fontWeight:700, letterSpacing:'-0.02em' }}>File system sinks</h2>

              <div style={{ display:'flex', flexDirection:'column', gap:10, maxHeight:280, overflowY:'auto', marginBottom:14 }}>
                {sinks.map((sink, i) => (
                  <div key={sink.id} style={{ background:'var(--surface2)', border:'1px solid var(--border)', borderRadius:10, padding:'14px', animation:'fadeUp 0.2s ease both' }}>

              }}>
                <div style={{ display:'flex', alignItems:'flex-start', gap:14 }}>
                  <div style={{
                    width:42, height:42, borderRadius:10, flexShrink:0,
                    background: squeezeMode ? 'oklch(0.65 0.14 290 / 0.15)' : 'var(--border)',
                    border:`1px solid ${squeezeMode ? 'oklch(0.65 0.14 290 / 0.35)' : 'var(--border2)'}`,
                    display:'flex', alignItems:'center', justifyContent:'center',
                    color: squeezeMode ? 'oklch(0.65 0.14 290)' : 'var(--text-3)',
                    transition:'all 0.2s', fontSize:20,
                  }}>
                    ⚡
                  </div>
                  <div style={{ flex:1 }}>
                    <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:6 }}>
                      <div>
                        <span style={{ fontSize:14, fontWeight:600, marginRight:8 }}>Squeeze Mode</span>
                        {squeezeMode && <span style={{ fontSize:10, fontWeight:600, letterSpacing:'0.06em', textTransform:'uppercase', color:'oklch(0.65 0.14 290)', background:'oklch(0.65 0.14 290 / 0.1)', border:'1px solid oklch(0.65 0.14 290 / 0.25)', borderRadius:4, padding:'2px 7px' }}>Active</span>}
                      </div>
                      {/* Toggle */}
                      <button onClick={() => setSqueezeMode(v => !v)} style={{
                        width:44, height:24, borderRadius:12, border:'none', cursor:'pointer', flexShrink:0,
                        background: squeezeMode ? 'oklch(0.65 0.14 290)' : 'var(--border2)',
                        position:'relative', transition:'background 0.25s',
                      }}>
                        <div style={{
                          position:'absolute', top:3, left: squeezeMode ? 22 : 3,
                          width:18, height:18, borderRadius:'50%', background:'white',
                          transition:'left 0.25s', boxShadow:'0 1px 4px rgba(0,0,0,0.3)',
                        }}/>
                      </button>
                    </div>
                    <p style={{ fontSize:13, color:'var(--text-3)', lineHeight:1.6 }}>

                    </p>
                    <div style={{ display:'flex', gap:16, marginTop:12 }}>
                      {[['~40–65%', 'size reduction'], ['LZ4+Zstd', 'algorithm'], ['Transparent', 'to clients']].map(([val, lbl]) => (

          {step === 3 && (

                    <Icon name="rename" size={12}/>Edit

                {/* Sinks */}

                  <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:10 }}>

                    <button onClick={()=>goTo(1)} style={{ background:'none', border:'none', cursor:'pointer', color:'var(--text-3)', fontSize:12, fontFamily:'var(--font-body)', display:'flex', alignItems:'center', gap:4 }}>

                      {s.label && <span style={{ fontSize:11, color:'var(--text-3)', background:'var(--border)', borderRadius:4, padding:'2px 7px', flexShrink:0 }}>{s.label}</span>}
                    </div>
                  ))}
                </div>

                {/* Engine */}
                <div style={{ background:'var(--surface2)', border:`1px solid ${squeezeMode ? 'oklch(0.65 0.14 290 / 0.3)' : 'var(--border)'}`, borderRadius:10, padding:'14px 16px', display:'flex', alignItems:'center', gap:12 }}>
                  <span style={{ fontSize:16 }}>⚡</span>
                  <div>
                    <div style={{ fontSize:11, color:'var(--text-3)', textTransform:'uppercase', letterSpacing:'0.04em', marginBottom:2 }}>Squeeze Mode</div>

                  </div>
                  <button onClick={()=>goTo(2)} style={{ marginLeft:'auto', background:'none', border:'none', cursor:'pointer', color:'var(--text-3)', fontSize:12, fontFamily:'var(--font-body)', display:'flex', alignItems:'center', gap:4 }}>
                    <Icon name="rename" size={12}/>Edit
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Footer nav */}
          <div style={{ padding:'16px 32px', borderTop:'1px solid var(--border)', display:'flex', alignItems:'center', justifyContent:'space-between', background:'var(--surface2)' }}>
            <button
              onClick={() => goTo(step - 1)}
              disabled={step === 0}
              style={{
                display:'flex', alignItems:'center', gap:6,
                padding:'8px 16px', borderRadius:8,
                background:'transparent', border:'1px solid var(--border)',
                color: step === 0 ? 'var(--text-3)' : 'var(--text-2)',
                cursor: step === 0 ? 'default' : 'pointer',
                fontSize:13, fontFamily:'var(--font-body)',
                opacity: step === 0 ? 0.4 : 1, transition:'all 0.15s',
              }}
            >
              ← Back
            </button>
            <span style={{ fontSize:12, color:'var(--text-3)' }}>{step + 1} of {STEPS.length}</span>
            {step < STEPS.length - 1 ? (
              <button
                onClick={() => canNext() && goTo(step + 1)}
                disabled={!canNext()}
                style={{
                  display:'flex', alignItems:'center', gap:6,
                  padding:'8px 20px', borderRadius:8, border:'none',
                  background: canNext() ? 'var(--accent)' : 'var(--surface)',
                  color: canNext() ? 'oklch(0.12 0.02 78)' : 'var(--text-3)',
                  cursor: canNext() ? 'pointer' : 'default',
                  fontSize:13, fontWeight:600, fontFamily:'var(--font-body)',
                  transition:'all 0.15s',
                }}
              >
                Continue →
              </button>
            ) : (
              <button
                onClick={handleFinish}
                style={{
                  display:'flex', alignItems:'center', gap:7,
                  padding:'8px 20px', borderRadius:8, border:'none',
                  background:'oklch(0.65 0.18 145)', color:'oklch(0.12 0.02 145)',
                  cursor:'pointer', fontSize:13, fontWeight:600, fontFamily:'var(--font-body)',
                  transition:'opacity 0.15s',
                }}
                onMouseEnter={e=>e.currentTarget.style.opacity='0.88'}
                onMouseLeave={e=>e.currentTarget.style.opacity='1'}
              >
                <Icon name="check" size={14}/>
                Initialize Vault
              </button>
            )}
          </div>
        </div>

        <div className={mounted ? 'anim-fadeup' : ''} style={{ textAlign:'center', marginTop:20, fontSize:12, color:'var(--text-3)', ...delay(160) }}>
          TheVault v2.4 · Self-hosted instance
        </div>
      </div>
    </div>
  );
}

// ── SERVER FILE BROWSER ────────────────────────────────────────
const FS_TREE = {
  '/': {
    mnt: {
      data: { vault: {}, backups: {}, media: { videos: {}, photos: {} } },
      storage: { cold: {}, hot: {} },
      ssd: { fast: {}, cache: {} },
      nas: { share1: {}, share2: {}, archive: {} },
    },
    home: {
      admin: { documents: {}, downloads: {} },
      vault: { store: {}, temp: {} },
    },
    var: {
      lib: { vault: {}, docker: {} },
      log: {},
      data: {},
    },
    opt: {
      vault: { data: {}, config: {} },
      apps: {},
    },
    srv: { files: {}, media: {} },
    tmp: {},
  },
};

function getNode(tree, parts) {
  let node = tree['/'];
  for (const p of parts) {
    if (!node || !node[p]) return {};
    node = node[p];
  }
  return node || {};
}

function ServerFileBrowser({ onSelect, onClose }) {
  const [pathParts, setPathParts] = React.useState([]);
  const [hovered, setHovered]     = React.useState(null);
  const [selected, setSelected]   = React.useState(null);

  const currentPath = '/' + pathParts.join('/');
  const currentNode = getNode(FS_TREE, pathParts);
  const entries = Object.keys(currentNode).sort();
  const hasChildren = (name) => Object.keys(currentNode[name] || {}).length > 0;

  function navigate(name) { setPathParts(p => [...p, name]); setSelected(null); }
  function goUp()         { setPathParts(p => p.slice(0, -1)); setSelected(null); }
  function goTo(idx)      { setPathParts(p => p.slice(0, idx)); setSelected(null); }

  const confirmPath = selected !== null
    ? (currentPath === '/' ? '/' + selected : currentPath + '/' + selected)
    : currentPath;

  return (
    <div style={{
      position:'fixed', inset:0, zIndex:900,
      background:'rgba(0,0,0,0.6)', backdropFilter:'blur(4px)',
      display:'flex', alignItems:'center', justifyContent:'center',
      animation:'fadeIn 0.15s ease both',
    }} onClick={e => { if(e.target===e.currentTarget) onClose(); }}>
      <div style={{
        width:580, maxHeight:'80vh', display:'flex', flexDirection:'column',
        background:'var(--surface)', border:'1px solid var(--border2)',
        borderRadius:14, overflow:'hidden',
        boxShadow:'0 24px 80px rgba(0,0,0,0.6)',
        animation:'scaleIn 0.2s cubic-bezier(0.22,1,0.36,1) both',
      }}>
        {/* Header */}
        <div style={{ padding:'14px 18px', borderBottom:'1px solid var(--border)', display:'flex', alignItems:'center', gap:10, flexShrink:0, background:'var(--surface2)' }}>
          <div style={{ width:28, height:28, borderRadius:7, background:'var(--accent-dim)', border:'1px solid oklch(0.72 0.14 78 / 0.25)', display:'flex', alignItems:'center', justifyContent:'center', color:'var(--accent)' }}>
            <Icon name="folder" size={14}/>
          </div>
          <span style={{ fontFamily:'var(--font-display)', fontSize:14, fontWeight:700, letterSpacing:'-0.01em' }}>Select Directory</span>
          <span style={{ fontSize:11, color:'var(--text-3)' }}>Server Filesystem</span>
          <button onClick={onClose} style={{ marginLeft:'auto', background:'none', border:'none', cursor:'pointer', color:'var(--text-3)', display:'flex', padding:4, borderRadius:5, transition:'color 0.15s' }}
            onMouseEnter={e=>e.currentTarget.style.color='var(--text)'}
            onMouseLeave={e=>e.currentTarget.style.color='var(--text-3)'}
          ><Icon name="x" size={15}/></button>
        </div>

        {/* Breadcrumb */}
        <div style={{ padding:'8px 18px', borderBottom:'1px solid var(--border)', display:'flex', alignItems:'center', gap:2, flexWrap:'wrap', background:'var(--surface2)', flexShrink:0 }}>
          <button onClick={()=>goTo(0)} style={{ background:'none', border:'none', cursor:'pointer', fontSize:12, fontFamily:'monospace', color:'var(--text-2)', padding:'2px 5px', borderRadius:4, transition:'background 0.1s' }}
            onMouseEnter={e=>e.currentTarget.style.background='var(--border)'}
            onMouseLeave={e=>e.currentTarget.style.background='none'}
          >/</button>
          {pathParts.map((part, i) => (
            <React.Fragment key={i}>
              <span style={{ color:'var(--text-3)', fontSize:12 }}>/</span>
              <button onClick={()=>goTo(i+1)} style={{ background:'none', border:'none', cursor:'pointer', fontSize:12, fontFamily:'monospace', color: i===pathParts.length-1 ? 'var(--text)' : 'var(--text-2)', padding:'2px 6px', borderRadius:4, fontWeight: i===pathParts.length-1 ? 600 : 400, transition:'background 0.1s' }}
                onMouseEnter={e=>{ if(i<pathParts.length-1) e.currentTarget.style.background='var(--border)'; }}
                onMouseLeave={e=>e.currentTarget.style.background='none'}
              >{part}</button>
            </React.Fragment>
          ))}
        </div>

        {/* File list */}
        <div style={{ flex:1, overflowY:'auto', padding:'8px' }}>
          {pathParts.length > 0 && (
            <div onClick={goUp} style={{ display:'flex', alignItems:'center', gap:10, padding:'8px 12px', borderRadius:7, cursor:'pointer', transition:'background 0.1s', marginBottom:2, color:'var(--text-3)' }}
              onMouseEnter={e=>e.currentTarget.style.background='var(--surface2)'}
              onMouseLeave={e=>e.currentTarget.style.background='transparent'}
            >
              <div style={{ width:26, height:26, borderRadius:6, background:'var(--surface2)', border:'1px solid var(--border)', display:'flex', alignItems:'center', justifyContent:'center' }}>
                <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><polyline points="10 4 6 8 10 12"/></svg>
              </div>
              <span style={{ fontSize:13, fontFamily:'monospace' }}>..</span>
              <span style={{ fontSize:11, color:'var(--text-3)' }}>parent directory</span>
            </div>
          )}
          {entries.length === 0 && (
            <div style={{ padding:'32px 0', textAlign:'center', color:'var(--text-3)', fontSize:13 }}>Empty directory</div>
          )}
          {entries.map(name => {
            const isSel = selected === name;
            const kids  = hasChildren(name);
            return (
              <div key={name}
                onClick={() => setSelected(isSel ? null : name)}
                onDoubleClick={() => kids && navigate(name)}
                style={{
                  display:'flex', alignItems:'center', gap:10, padding:'8px 12px', borderRadius:7, cursor:'pointer', marginBottom:1,
                  background: isSel ? 'var(--accent-dim)' : hovered===name ? 'var(--surface2)' : 'transparent',
                  border:`1px solid ${isSel ? 'oklch(0.72 0.14 78 / 0.25)' : 'transparent'}`,
                  transition:'background 0.1s, border-color 0.1s',
                }}
                onMouseEnter={()=>setHovered(name)}
                onMouseLeave={()=>setHovered(null)}
              >
                <div style={{ width:26, height:26, borderRadius:6, flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center', background: isSel ? 'var(--accent-dim)' : 'oklch(0.72 0.14 78 / 0.08)', border:`1px solid ${isSel ? 'oklch(0.72 0.14 78 / 0.3)' : 'oklch(0.72 0.14 78 / 0.15)'}` }}>
                  <Icon name="folder" size={13} style={{ color:'var(--accent)' }}/>
                </div>
                <span style={{ fontSize:13, fontFamily:'monospace', flex:1, color: isSel ? 'var(--accent)' : 'var(--text)', fontWeight: isSel ? 500 : 400 }}>{name}</span>
                <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                  {kids && <span style={{ fontSize:10, color:'var(--text-3)', background:'var(--surface2)', border:'1px solid var(--border)', borderRadius:4, padding:'1px 6px' }}>
                    {Object.keys(currentNode[name]).length} dir{Object.keys(currentNode[name]).length!==1?'s':''}
                  </span>}
                  {kids && (
                    <button onClick={e=>{ e.stopPropagation(); navigate(name); }} style={{ background:'none', border:'none', cursor:'pointer', color: hovered===name ? 'var(--text-2)' : 'var(--text-3)', display:'flex', padding:3, borderRadius:4, transition:'color 0.1s' }}>
                      <Icon name="chevronRight" size={14}/>
                    </button>
                  )}
                </div>
              </div>
            );
          })}
        </div>

        {/* Footer */}
        <div style={{ padding:'12px 18px', borderTop:'1px solid var(--border)', display:'flex', alignItems:'center', gap:10, flexShrink:0, background:'var(--surface2)' }}>
          <div style={{ flex:1, padding:'8px 12px', background:'var(--surface)', border:'1px solid var(--border)', borderRadius:7, fontFamily:'monospace', fontSize:12, color:'var(--text-2)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', minWidth:0 }}>
            {confirmPath}
          </div>
          <button onClick={onClose} style={{ padding:'8px 16px', borderRadius:7, border:'1px solid var(--border2)', background:'transparent', color:'var(--text-2)', cursor:'pointer', fontSize:13, fontFamily:'var(--font-body)', transition:'all 0.15s', flexShrink:0 }}
            onMouseEnter={e=>e.currentTarget.style.background='var(--surface)'}
            onMouseLeave={e=>e.currentTarget.style.background='transparent'}
          >Cancel</button>
          <button onClick={()=>{ onSelect(confirmPath); onClose(); }} style={{ padding:'8px 18px', borderRadius:7, border:'none', background:'var(--accent)', color:'oklch(0.12 0.02 78)', cursor:'pointer', fontSize:13, fontWeight:600, fontFamily:'var(--font-body)', transition:'opacity 0.15s', flexShrink:0 }}
            onMouseEnter={e=>e.currentTarget.style.opacity='0.85'}
            onMouseLeave={e=>e.currentTarget.style.opacity='1'}
          >Select Directory</button>
        </div>
      </div>
    </div>
  );
}

// ── INVITE USER DIALOG ───────────────────────────────────────────────────────
const GLOBAL_ROLES = [
  { id:'admin',  label:'Admin',  desc:'Gestisce utenti e configurazione vault',   color:'oklch(0.72 0.14 78)'  },
  { id:'member', label:'Member', desc:'Accede ai sink secondo i permessi assegnati', color:'oklch(0.65 0.14 145)' },
  { id:'viewer', label:'Viewer', desc:'Sola lettura su tutti i sink accessibili',  color:'oklch(0.65 0.14 200)' },
];

function InviteUserDialog({ normalSinks, onConfirm, onCancel }) {
  const [email, setEmail]   = useState('');
  const [name, setName]     = useState('');
  const [role, setRole]     = useState('member');
  // permissions: { [sinkId]: 'full' | 'write' | 'read' | 'none' }
  const [perms, setPerms]   = useState(() =>
    Object.fromEntries(normalSinks.map(s => [s.id, role === 'admin' ? 'full' : 'read']))
  );

  const canConfirm = email.trim().includes('@') && name.trim().length > 0;

  function handleRoleChange(r) {
    setRole(r);
    if (r === 'admin') setPerms(Object.fromEntries(normalSinks.map(s => [s.id, 'full'])));
    if (r === 'viewer') setPerms(Object.fromEntries(normalSinks.map(s => [s.id, 'read'])));
  }

  const PERM_OPTIONS = [
    { id:'full',  label:'Full',       color:'var(--accent)'             },
    { id:'write', label:'Read/Write', color:'oklch(0.65 0.14 145)'      },
    { id:'read',  label:'Read Only',  color:'oklch(0.65 0.14 200)'      },
    { id:'none',  label:'No Access',  color:'var(--text-3)'             },
  ];

  const inputBase = { width:'100%', padding:'9px 12px', background:'var(--surface2)', border:'1px solid var(--border)', borderRadius:8, color:'var(--text)', outline:'none', transition:'border-color 0.15s', fontFamily:'var(--font-body)', fontSize:13 };

  return (
    <div style={{ position:'fixed', inset:0, zIndex:700, background:'rgba(0,0,0,0.65)', display:'flex', alignItems:'center', justifyContent:'center', animation:'fadeIn 0.2s ease both', backdropFilter:'blur(4px)' }} onClick={e => e.target === e.currentTarget && onCancel()}>
      <div style={{ background:'var(--surface)', border:'1px solid var(--border2)', borderRadius:16, width:460, maxWidth:'calc(100vw - 32px)', boxShadow:'0 24px 80px rgba(0,0,0,0.6)', animation:'scaleIn 0.22s cubic-bezier(0.22,1,0.36,1) both', overflow:'hidden', maxHeight:'90vh', display:'flex', flexDirection:'column' }}>

        {/* Header */}
        <div style={{ padding:'20px 22px 16px', borderBottom:'1px solid var(--border)', display:'flex', alignItems:'center', justifyContent:'space-between', flexShrink:0 }}>
          <div style={{ fontSize:15, fontWeight:700, fontFamily:'var(--font-display)' }}>Invita utente</div>
          <button onClick={onCancel} style={{ background:'none', border:'none', cursor:'pointer', color:'var(--text-3)', display:'flex', padding:4, borderRadius:6 }}><Icon name="x" size={15}/></button>
        </div>

        <div style={{ padding:'20px 22px', overflowY:'auto', flex:1 }}>

          {/* Name + Email */}
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, marginBottom:16 }}>
            <div>
              <label style={{ display:'block', fontSize:11, color:'var(--text-3)', marginBottom:6, textTransform:'uppercase', letterSpacing:'0.04em' }}>Nome <span style={{color:'var(--danger)'}}>*</span></label>
              <input value={name} onChange={e=>setName(e.target.value)} placeholder="Mario Rossi" autoFocus style={inputBase} onFocus={e=>e.target.style.borderColor='var(--accent)'} onBlur={e=>e.target.style.borderColor='var(--border)'}/>
            </div>
            <div>
              <label style={{ display:'block', fontSize:11, color:'var(--text-3)', marginBottom:6, textTransform:'uppercase', letterSpacing:'0.04em' }}>Email <span style={{color:'var(--danger)'}}>*</span></label>
              <input value={email} onChange={e=>setEmail(e.target.value)} placeholder="utente@dominio.com" type="email" style={inputBase} onFocus={e=>e.target.style.borderColor='var(--accent)'} onBlur={e=>e.target.style.borderColor='var(--border)'}/>
            </div>
          </div>

          {/* Global role */}
          <div style={{ marginBottom:20 }}>
            <label style={{ display:'block', fontSize:11, color:'var(--text-3)', marginBottom:8, textTransform:'uppercase', letterSpacing:'0.04em' }}>Ruolo globale</label>
            <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:7 }}>
              {GLOBAL_ROLES.map(r => (
                <div key={r.id} onClick={() => handleRoleChange(r.id)} style={{ padding:'10px 12px', borderRadius:9, cursor:'pointer', border: role === r.id ? `1.5px solid ${r.color}` : '1px solid var(--border)', background: role === r.id ? `${r.color}14` : 'var(--surface2)', transition:'all 0.15s' }}>
                  <div style={{ fontSize:12, fontWeight:600, color: role === r.id ? r.color : 'var(--text)', marginBottom:3 }}>{r.label}</div>
                  <div style={{ fontSize:10, color:'var(--text-3)', lineHeight:1.4 }}>{r.desc}</div>
                </div>
              ))}
            </div>
          </div>

          {/* Per-sink permissions */}
          {normalSinks.length > 0 && (
            <div>
              <label style={{ display:'block', fontSize:11, color:'var(--text-3)', marginBottom:8, textTransform:'uppercase', letterSpacing:'0.04em' }}>Permessi per sink</label>
              <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
                {normalSinks.map(sink => (
                  <div key={sink.id} style={{ display:'flex', alignItems:'center', gap:10, padding:'9px 12px', background:'var(--surface2)', borderRadius:8, border:'1px solid var(--border)' }}>
                    <div style={{ display:'flex', alignItems:'center', gap:7, flex:1, minWidth:0 }}>
                      <Icon name="folder" size={12} style={{color:'oklch(0.65 0.14 200)', flexShrink:0}}/>
                      <span style={{ fontSize:12, color:'var(--text-2)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{sink.label || sink.path || `Sink #${sink.id}`}</span>
                    </div>
                    <div style={{ display:'flex', gap:4, flexShrink:0 }}>
                      {PERM_OPTIONS.map(opt => {
                        const active = perms[sink.id] === opt.id;
                        return (
                          <button key={opt.id} onClick={() => setPerms(p => ({...p, [sink.id]: opt.id}))} style={{ padding:'4px 9px', borderRadius:5, border: active ? `1px solid ${opt.color}` : '1px solid var(--border)', background: active ? `${opt.color}20` : 'transparent', color: active ? opt.color : 'var(--text-3)', fontSize:10, fontWeight: active ? 600 : 400, cursor:'pointer', fontFamily:'var(--font-body)', transition:'all 0.12s', whiteSpace:'nowrap' }}>
                            {opt.label}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>

        {/* Footer */}
        <div style={{ padding:'14px 22px 18px', borderTop:'1px solid var(--border)', display:'flex', justifyContent:'flex-end', gap:10, flexShrink:0 }}>
          <button onClick={onCancel} style={{ padding:'9px 18px', background:'none', border:'1px solid var(--border2)', borderRadius:8, fontSize:13, color:'var(--text-2)', cursor:'pointer', fontFamily:'var(--font-body)' }}>Annulla</button>
          <button onClick={() => canConfirm && onConfirm({ id:Date.now(), email:email.trim(), name:name.trim(), role, permissions:perms, createdAt:new Date() })} disabled={!canConfirm} style={{ padding:'9px 20px', background: canConfirm ? 'var(--accent)' : 'var(--border)', border:'none', borderRadius:8, fontSize:13, fontWeight:600, color: canConfirm ? 'oklch(0.12 0.02 78)' : 'var(--text-3)', cursor: canConfirm ? 'pointer' : 'not-allowed', fontFamily:'var(--font-body)', transition:'all 0.15s' }}>
            Invita utente
          </button>
        </div>
      </div>
    </div>
  );
}

// ── ADD SINK DIALOG ──────────────────────────────────────────────────────────
function AddSinkDialog({ normalSinks, onConfirm, onCancel }) {
  const [type, setType]         = useState('normal');
  const [path, setPath]         = useState('');
  const [label, setLabel]       = useState('');
  const [mirrorOf, setMirrorOf] = useState(normalSinks[0]?.id ?? null);

  // Cloud / Google Drive state
  const [gdConnected, setGdConnected]   = useState(false);
  const [gdConnecting, setGdConnecting] = useState(false);
  const [gdAccount, setGdAccount]       = useState('');
  const [gdFolder, setGdFolder]         = useState('');
  const [gdFolderName, setGdFolderName] = useState('');

  const MIRROR_COLOR = 'oklch(0.65 0.14 200)';
  const CLOUD_COLOR  = 'oklch(0.60 0.16 250)';

  function simulateGdAuth() {
    setGdConnecting(true);
    setTimeout(() => {
      setGdConnecting(false);
      setGdConnected(true);
      setGdAccount('utente@gmail.com');
    }, 1800);
  }

  function gdDisconnect() {
    setGdConnected(false);
    setGdAccount('');
    setGdFolder('');
    setGdFolderName('');
  }

  // Extract folder name from Drive URL or use raw value
  function handleGdFolderChange(val) {
    setGdFolder(val);
    const match = val.match(/\/folders\/([a-zA-Z0-9_-]+)/);
    if (match) setGdFolderName('Drive Folder (' + match[1].slice(0,8) + '…)');
    else setGdFolderName(val ? val.split('/').filter(Boolean).pop() || '' : '');
  }

  const canConfirm =
    (type === 'normal' && path.trim().length > 0) ||
    (type === 'mirror' && path.trim().length > 0 && mirrorOf !== null) ||
    (type === 'cloud'  && gdConnected && gdFolder.trim().length > 0);
  const noNormalSinks = normalSinks.length === 0;

  function handleConfirm() {
    if (type === 'cloud') {
      onConfirm({
        id: Date.now(),
        path: gdFolder.trim(),
        label: label.trim() || gdFolderName || 'Google Drive',
        type: 'cloud',
        mirrorOf: null,
        cloud: { provider: 'gdrive', account: gdAccount, folderUrl: gdFolder.trim(), folderName: gdFolderName },
      });
    } else {
      onConfirm({
        id: Date.now(),
        path: path.trim(),
        label: label.trim(),
        type,
        mirrorOf: type === 'mirror' ? mirrorOf : null,
      });
    }
  }

  const inputBase = {
    width:'100%', padding:'9px 12px',
    background:'var(--surface2)', border:'1px solid var(--border)',
    borderRadius:8, color:'var(--text)', outline:'none',
    transition:'border-color 0.15s', fontFamily:'var(--font-body)', fontSize:13,
  };

  return (
    <div
      style={{ position:'fixed', inset:0, zIndex:700, background:'rgba(0,0,0,0.65)', display:'flex', alignItems:'center', justifyContent:'center', animation:'fadeIn 0.2s ease both', backdropFilter:'blur(4px)' }}
      onClick={e => e.target === e.currentTarget && onCancel()}
    >
      <div style={{ background:'var(--surface)', border:'1px solid var(--border2)', borderRadius:16, width:440, maxWidth:'calc(100vw - 32px)', boxShadow:'0 24px 80px rgba(0,0,0,0.6)', animation:'scaleIn 0.22s cubic-bezier(0.22,1,0.36,1) both', overflow:'hidden' }}>

        {/* Header */}
        <div style={{ padding:'20px 22px 16px', borderBottom:'1px solid var(--border)', display:'flex', alignItems:'center', justifyContent:'space-between' }}>
          <div style={{ fontSize:15, fontWeight:700, fontFamily:'var(--font-display)' }}>Add Sink</div>
          <button onClick={onCancel} style={{ background:'none', border:'none', cursor:'pointer', color:'var(--text-3)', display:'flex', padding:4, borderRadius:6 }}>
            <Icon name="x" size={15}/>
          </button>
        </div>

        <div style={{ padding:'20px 22px 22px' }}>

          {/* Type selector */}
          <div style={{ marginBottom:18 }}>
            <label style={{ display:'block', fontSize:11, color:'var(--text-3)', marginBottom:8, textTransform:'uppercase', letterSpacing:'0.04em' }}>Tipo</label>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:8 }}>
              {[
                { id:'normal', label:'Normal',       icon:'folder',  desc:'Directory su disco',              color:'var(--accent)' },
                { id:'mirror', label:'Mirror',       icon:'mirror',  desc:'Replica bidirezionale real-time',  color:MIRROR_COLOR,   disabled: noNormalSinks },
                { id:'cloud',  label:'Cloud',        icon:'gdrive',  desc:'Google Drive (mirror-only)',       color:CLOUD_COLOR },
              ].map(opt => (
                <div
                  key={opt.id}
                  onClick={() => !opt.disabled && setType(opt.id)}
                  style={{
                    padding:'12px 14px', borderRadius:10,
                    cursor: opt.disabled ? 'not-allowed' : 'pointer',
                    border: type === opt.id ? `1.5px solid ${opt.color}` : '1px solid var(--border)',
                    background: type === opt.id ? `${opt.color}18` : 'var(--surface2)',
                    opacity: opt.disabled ? 0.38 : 1,
                    transition:'all 0.15s', position:'relative',
