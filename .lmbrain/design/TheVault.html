const TRASH_MOCK = [
  { id:101, name:'Old Presentation.pptx', folder:false, size:8400000,  deletedAt: new Date('2026-04-20T10:22:00'), expiresIn:10 },
  { id:102, name:'test_branch',           folder:true,  size:null,     deletedAt: new Date('2026-04-18T15:05:00'), expiresIn:8  },
  { id:103, name:'invoice_draft.pdf',     folder:false, size:340000,   deletedAt: new Date('2026-04-15T09:00:00'), expiresIn:5  },
  { id:104, name:'backup_2024.zip',       folder:false, size:182000000,deletedAt: new Date('2026-04-10T11:30:00'), expiresIn:0  },
  { id:105, name:'scratch_notes.md',      folder:false, size:1800,     deletedAt: new Date('2026-04-22T17:45:00'), expiresIn:12 },
  { id:106, name:'unused_assets',         folder:true,  size:null,     deletedAt: new Date('2026-04-08T08:10:00'), expiresIn:0  },
  { id:107, name:'export_v1.mp4',         folder:false, size:312000000,deletedAt: new Date('2026-04-05T14:20:00'), expiresIn:0  },
];

function TrashView({ notify }) {
  const [items, setItems] = React.useState(TRASH_MOCK);
  const [selected, setSelected] = React.useState(new Set());
  const [confirm, setConfirm] = React.useState(null); // { type: 'empty' | 'deleteSelected' | 'deleteOne', item? }

  const danger  = 'oklch(0.65 0.18 25)';
  const dangerBg = 'oklch(0.65 0.18 25 / 0.08)';
  const dangerBorder = 'oklch(0.65 0.18 25 / 0.22)';

  function toggleSelect(id) {
    setSelected(prev => {
      const next = new Set(prev);
      next.has(id) ? next.delete(id) : next.add(id);
      return next;
    });
  }

  function toggleAll() {
    if (selected.size === items.length) setSelected(new Set());
    else setSelected(new Set(items.map(i => i.id)));
  }

  function restoreSelected() {
    setItems(prev => prev.filter(i => !selected.has(i.id)));
    notify(`Restored ${selected.size} item${selected.size > 1 ? 's' : ''} to vault`);
    setSelected(new Set());
  }

  function deleteSelected() {
    setItems(prev => prev.filter(i => !selected.has(i.id)));
    notify(`Permanently deleted ${selected.size} item${selected.size > 1 ? 's' : ''}`);
    setSelected(new Set());
  }

  function emptyTrash() {
    setItems([]);
    setSelected(new Set());
    setConfirm(null);
    notify('Trash emptied — all items permanently deleted');
  }

  function expiryLabel(days) {
    if (days <= 0) return { label: 'Expires today', color: danger };
    if (days <= 3) return { label: `${days}d left`, color: 'oklch(0.72 0.14 78)' };
    return { label: `${days}d left`, color: 'var(--text-3)' };
  }

  const selCount = selected.size;

  return (
    <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden', background:`repeating-linear-gradient(
      -45deg,
      transparent,
      transparent 28px,
      oklch(0.65 0.18 25 / 0.018) 28px,
      oklch(0.65 0.18 25 / 0.018) 30px
    )` }}>

      {/* Danger header banner */}
      <div style={{
        padding:'14px 24px', flexShrink:0,
        background: dangerBg,
        borderBottom: `1px solid ${dangerBorder}`,
        display:'flex', alignItems:'center', gap:14,
      }}>
        <div style={{ width:36, height:36, borderRadius:10, background: dangerBg, border:`1px solid ${dangerBorder}`, display:'flex', alignItems:'center', justifyContent:'center', color:danger, flexShrink:0 }}>
          <Icon name="trash" size={18}/>
        </div>
        <div style={{ flex:1 }}>
          <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:2 }}>
            <h1 style={{ fontFamily:'var(--font-display)', fontSize:16, fontWeight:700, letterSpacing:'-0.01em', color:'var(--text)' }}>Trash</h1>
            <span style={{ fontSize:10, fontWeight:700, letterSpacing:'0.07em', textTransform:'uppercase', color:danger, background:dangerBg, border:`1px solid ${dangerBorder}`, borderRadius:4, padding:'2px 8px' }}>
              {items.length} item{items.length !== 1 ? 's' : ''}
            </span>
          </div>
          <p style={{ fontSize:12, color:'var(--text-3)', lineHeight:1.4 }}>
            Files here are permanently deleted after 30 days. Restore them to move back to your vault.
          </p>
        </div>
        {items.length > 0 && (
          <button onClick={()=>setConfirm({ type:'empty' })} style={{
            padding:'8px 16px', borderRadius:8, border:`1px solid ${dangerBorder}`,
            background:'transparent', color:danger, cursor:'pointer',
            fontSize:12, fontWeight:500, fontFamily:'var(--font-body)',
            display:'flex', alignItems:'center', gap:7, flexShrink:0,
            transition:'background 0.15s',
          }}
          onMouseEnter={e=>e.currentTarget.style.background=dangerBg}
          onMouseLeave={e=>e.currentTarget.style.background='transparent'}
          >
            <Icon name="trash" size={13}/>
            Empty Trash
          </button>
        )}
      </div>

      {/* Selection bar */}
      {selCount > 0 && (
        <div style={{
          padding:'8px 24px', display:'flex', alignItems:'center', gap:10, flexShrink:0,
          background:'oklch(0.65 0.18 25 / 0.05)', borderBottom:`1px solid ${dangerBorder}`,
          animation:'fadeIn 0.15s ease',
        }}>
          <span style={{ fontSize:13, fontWeight:500, color:danger }}>{selCount} selected</span>
          <div style={{ flex:1 }}/>
          <button onClick={restoreSelected} style={{
            display:'flex', alignItems:'center', gap:6, padding:'6px 14px',
            background:'var(--surface)', border:'1px solid var(--border)',
            borderRadius:7, cursor:'pointer', fontSize:12, color:'var(--text-2)',
            fontFamily:'var(--font-body)', transition:'all 0.15s',
          }}
          onMouseEnter={e=>{ e.currentTarget.style.borderColor='oklch(0.65 0.18 145)'; e.currentTarget.style.color='oklch(0.65 0.18 145)'; }}
          onMouseLeave={e=>{ e.currentTarget.style.borderColor='var(--border)'; e.currentTarget.style.color='var(--text-2)'; }}
          >
            <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M1 10 A8 8 0 1 1 3.5 3.5"/></svg>
            Restore
          </button>
          <button onClick={()=>setConfirm({ type:'deleteSelected' })} style={{
            display:'flex', alignItems:'center', gap:6, padding:'6px 14px',
            background:dangerBg, border:`1px solid ${dangerBorder}`,
            borderRadius:7, cursor:'pointer', fontSize:12, color:danger,
            fontFamily:'var(--font-body)', fontWeight:500,
          }}>
            <Icon name="trash" size={12}/>
            Delete permanently
          </button>
          <button onClick={()=>setSelected(new Set())} style={{ background:'none', border:'none', cursor:'pointer', color:'var(--text-3)', display:'flex', padding:2 }}>
            <Icon name="x" size={14}/>
          </button>
        </div>
      )}

      {/* Table */}
      <div style={{ flex:1, overflowY:'auto', padding:'16px 24px' }}>
        {items.length === 0 ? (
          <div style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', height:'100%', gap:14, opacity:0.5 }}>
            <Icon name="trash" size={40} style={{ color:'var(--text-3)' }}/>
            <div style={{ fontSize:15, fontWeight:500, color:'var(--text-3)' }}>Trash is empty</div>
          </div>
        ) : (
          <div style={{ background:'var(--surface)', border:`1px solid ${dangerBorder}`, borderRadius:12, overflow:'hidden' }}>
            {/* Header */}
            <div style={{
              display:'grid', gridTemplateColumns:'36px 36px 1fr 90px 130px 110px 90px',
              padding:'9px 16px', borderBottom:`1px solid ${dangerBorder}`,
              background:dangerBg, gap:10, alignItems:'center',
            }}>
              <div/>
              <input type="checkbox"
                checked={selCount === items.length && items.length > 0}
                onChange={toggleAll}
                style={{ width:14, height:14, accentColor:danger, cursor:'pointer' }}
              />
              <div style={{ fontSize:11, textTransform:'uppercase', letterSpacing:'0.05em', color:'var(--text-3)', fontWeight:500 }}>Name</div>
              <div style={{ fontSize:11, textTransform:'uppercase', letterSpacing:'0.05em', color:'var(--text-3)', fontWeight:500, textAlign:'right' }}>Size</div>
              <div style={{ fontSize:11, textTransform:'uppercase', letterSpacing:'0.05em', color:'var(--text-3)', fontWeight:500 }}>Deleted</div>
              <div style={{ fontSize:11, textTransform:'uppercase', letterSpacing:'0.05em', color:'var(--text-3)', fontWeight:500 }}>Expires</div>
              <div/>
            </div>

            {/* Rows */}
            {items.map((item, i) => {
              const ft = getFileType(item.name, item.folder);
              const fc = FILE_COLORS[ft];
              const isSel = selected.has(item.id);
              const exp = expiryLabel(item.expiresIn);
              return (
                <div key={item.id} style={{
                  display:'grid', gridTemplateColumns:'36px 36px 1fr 90px 130px 110px 90px',
                  padding:'10px 16px', borderBottom: i < items.length-1 ? `1px solid ${dangerBorder}` : 'none',
                  alignItems:'center', gap:10,
                  background: isSel ? 'oklch(0.65 0.18 25 / 0.06)' : 'transparent',
                  transition:'background 0.1s',
                  animation:`fadeUp 0.25s ${i*30}ms both`,
                }}
                onMouseEnter={e=>{ if(!isSel) e.currentTarget.style.background='oklch(0.65 0.18 25 / 0.04)'; }}
                onMouseLeave={e=>{ if(!isSel) e.currentTarget.style.background='transparent'; }}
                >
                  {/* Strikethrough overlay hint */}
                  <div style={{ opacity:0.4, color:danger }}><Icon name={ft} size={16} style={{ color:fc, opacity:0.5 }}/></div>

                  <input type="checkbox"
                    checked={isSel}
                    onChange={()=>toggleSelect(item.id)}
                    style={{ width:14, height:14, accentColor:danger, cursor:'pointer' }}
                  />

                  <div style={{ minWidth:0 }}>
                    <div style={{ fontSize:13, fontWeight:500, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis', textDecoration:'line-through', textDecorationColor:'oklch(0.65 0.18 25 / 0.4)', color:'var(--text-2)' }}>
                      {item.name}
                    </div>
                    <div style={{ fontSize:11, color:'var(--text-3)', marginTop:1 }}>
                      {item.folder ? 'Folder' : getFileType(item.name, false)}
                    </div>
                  </div>

                  <div style={{ fontSize:12, color:'var(--text-3)', textAlign:'right', fontFamily:'monospace' }}>{item.folder ? '—' : fmtSize(item.size)}</div>

                  <div style={{ fontSize:12, color:'var(--text-3)' }}>{fmtDate(item.deletedAt)}</div>

                  <div style={{ fontSize:11, fontWeight:600, color:exp.color }}>{exp.label}</div>

                  <div style={{ display:'flex', alignItems:'center', justifyContent:'flex-end', gap:4 }}>
                    <button onClick={()=>{ setItems(prev=>prev.filter(x=>x.id!==item.id)); notify(`"${item.name}" restored to vault`); }} title="Restore" style={{ background:'none', border:'none', cursor:'pointer', color:'var(--text-3)', display:'flex', padding:4, borderRadius:5, transition:'color 0.15s' }}
                      onMouseEnter={e=>e.currentTarget.style.color='oklch(0.65 0.18 145)'}
                      onMouseLeave={e=>e.currentTarget.style.color='var(--text-3)'}
                    >
                      <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M1 10 A8 8 0 1 1 3.5 3.5"/></svg>
                    </button>
                    <button onClick={()=>setConfirm({ type:'deleteOne', item })} title="Delete permanently" style={{ background:'none', border:'none', cursor:'pointer', color:'var(--text-3)', display:'flex', padding:4, borderRadius:5, transition:'color 0.15s' }}
                      onMouseEnter={e=>e.currentTarget.style.color=danger}
                      onMouseLeave={e=>e.currentTarget.style.color='var(--text-3)'}
                    >
                      <Icon name="x" size={13}/>
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* Confirm dialogs */}
      {confirm?.type === 'empty' && (
        <ConfirmDialog
          variant="danger"
          icon="trash"
          title="Empty Trash permanently?"
          message={`This will permanently delete all ${items.length} item${items.length !== 1 ? 's' : ''} in the trash. This action cannot be undone.`}
          confirmLabel="Empty Trash"
          cancelLabel="Cancel"
          onConfirm={emptyTrash}
          onCancel={()=>setConfirm(null)}
        />
      )}
      {confirm?.type === 'deleteSelected' && (
        <ConfirmDialog
          variant="danger"
          icon="trash"
          title={`Delete ${selCount} item${selCount !== 1 ? 's' : ''} permanently?`}
          message="These files will be removed forever and cannot be recovered."
          confirmLabel="Delete permanently"
          cancelLabel="Cancel"
          onConfirm={()=>{ deleteSelected(); setConfirm(null); }}
          onCancel={()=>setConfirm(null)}
        />
      )}
      {confirm?.type === 'deleteOne' && (
        <ConfirmDialog
          variant="danger"
          icon="trash"
          title="Delete permanently?"
          message="This file will be removed forever and cannot be recovered."
          detail={confirm.item?.name}
          confirmLabel="Delete permanently"
          cancelLabel="Cancel"
          onConfirm={()=>{ setItems(prev=>prev.filter(x=>x.id!==confirm.item.id)); notify(`"${confirm.item.name}" permanently deleted`); setConfirm(null); }}
          onCancel={()=>setConfirm(null)}
        />
      )}
    </div>
  );
}

// ── DASHBOARD ────────────────────────────────────────────────────────────────
function Dashboard({ tweaks, vaultName, vaultConfig, setVaultConfig, onLogout }) {
  const [view, setView] = useState(tweaks.defaultView || 'grid');
  const [selected, setSelected] = useState(new Set());
  const [navId, setNavId] = useState('home');
  const [search, setSearch] = useState('');
  const [contextMenu, setContextMenu] = useState(null);
  const [detailFile, setDetailFile] = useState(null);
  const [uploads, setUploads] = useState(null);
  const [compressionDialog, setCompressionDialog] = useState(null); // { phase, fileInfo }
  const [multiCompressDialog, setMultiCompressDialog] = useState(null); // files[]
  const [notification, setNotification] = useState(null);
  const sidebarW = tweaks.sidebarWidth || 220;

  const files = navId === 'starred'
    ? MOCK_FILES.filter(f => f.starred)
    : navId === 'recent'
    ? [...MOCK_FILES].sort((a,b) => b.modified - a.modified).slice(0, 6)
    : MOCK_FILES.filter(f => !search || f.name.toLowerCase().includes(search.toLowerCase()));

  function toggleSelect(id) {
    setSelected(prev => {
      const s = new Set(prev);
      s.has(id) ? s.delete(id) : s.add(id);
      // Single selection → open detail panel; 0 or multi → close it
      const file = files.find(f => f.id === id);
      if (s.size === 1 && file && !file.folder) {
        setDetailFile(file);
      } else {
        setDetailFile(null);
      }
      return s;
    });
  }

  function showCtx(e, file) {
    e.preventDefault();
    setContextMenu({
      x: e.clientX, y: e.clientY,
      items: [
        { icon:'eye',      label:'Preview',  action:()=>setDetailFile(file) },
        { icon:'download', label:'Download', action:()=>notify('Download started') },
        { icon:'share',    label:'Share',    action:()=>notify('Link copied to clipboard') },
        { icon:'copy',     label:'Duplicate',action:()=>notify('File duplicated') },
        { icon:'move',     label:'Move to…', action:()=>notify('Move dialog opening…') },
        { icon:'rename',   label:'Rename',   action:()=>notify('Rename mode') },
        '---',
        { icon:'star',     label:'Add to Starred', action:()=>notify('Added to starred') },
        '---',
        { icon:'trash',    label:'Delete',   action:()=>notify('Moved to trash'), danger:true },
      ],
    });
  }

  function notify(msg) {
    setNotification(msg);
    setTimeout(() => setNotification(null), 2200);
  }

  // Mock MoSqueeze predict responses (cicla tra comprimibile e non)
  const MOCK_PREDICTS = [
    {
      filename:'presentation.pdf', extension:'.pdf',
      input_size:2458624, input_size_human:'2.3 MiB',
      should_skip:false, skip_reason:null,
      options:[
        { id:'skip',     algorithm:null,     level:0, estimated_ratio:1.0,  estimated_size:2458624, estimated_size_human:'2.3 MiB',  speed:'instant', time_estimate:'instant' },
        { id:'fast',     algorithm:'zstd',   level:3, estimated_ratio:2.15, estimated_size:1142662, estimated_size_human:'1.1 MiB',  speed:'fast',    time_estimate:'~50ms'   },
        { id:'balanced', algorithm:'brotli', level:6, estimated_ratio:2.85, estimated_size:862672,  estimated_size_human:'842 KiB',  speed:'medium',  time_estimate:'~200ms'  },
        { id:'max',      algorithm:'zpaq',   level:3, estimated_ratio:3.42, estimated_size:718539,  estimated_size_human:'701 KiB',  speed:'slow',    time_estimate:'~5s'     },
      ],
    },
    {
      filename:'photo_shoot.jpg', extension:'.jpg',
      input_size:4500000, input_size_human:'4.3 MiB',
      should_skip:true,
      skip_reason:'JPEG is already lossy-compressed; further compression is counterproductive.',
      options:[{ id:'skip', time_estimate:'instant' }],
    },
    {
      filename:'data_export.zip', extension:'.zip',
      input_size:18700000, input_size_human:'17.8 MiB',
      should_skip:false, skip_reason:null,
      options:[
        { id:'skip',     algorithm:null,    level:0, estimated_ratio:1.0,  estimated_size:18700000, estimated_size_human:'17.8 MiB', speed:'instant', time_estimate:'instant' },
        { id:'fast',     algorithm:'zstd',  level:3, estimated_ratio:1.08, estimated_size:17314814, estimated_size_human:'16.5 MiB', speed:'fast',    time_estimate:'~80ms'   },
        { id:'balanced', algorithm:'lzma',  level:6, estimated_ratio:1.14, estimated_size:16403508, estimated_size_human:'15.6 MiB', speed:'medium',  time_estimate:'~400ms'  },
        { id:'max',      algorithm:'zpaq',  level:3, estimated_ratio:1.19, estimated_size:15714285, estimated_size_human:'15.0 MiB', speed:'slow',    time_estimate:'~12s'    },
      ],
    },
  ];
  const mockPredictIdx = useRef(0);

  function startUploadProgress(fileInfo, chosenOption) {
    const algo = chosenOption?.algorithm || null;
    let progs = [{ name: fileInfo.filename, progress: 0, algo }];
    setUploads(progs);
    const interval = setInterval(() => {
      progs = progs.map(f => ({ ...f, progress: Math.min(100, f.progress + Math.random() * 28 + 8) }));
      setUploads([...progs]);
      if (progs.every(f => f.progress >= 100)) clearInterval(interval);
    }, 250);
  }

  function handleUpload() {
    const predict = MOCK_PREDICTS[mockPredictIdx.current % MOCK_PREDICTS.length];
    mockPredictIdx.current += 1;

    // Fase 1: analyzing
    setCompressionDialog({ phase:'analyzing', fileInfo: predict });

    // Simula latenza API predict (~900ms)
    setTimeout(() => {
      if (predict.should_skip) {
        setCompressionDialog({ phase:'skip', fileInfo: predict });
      } else {
        setCompressionDialog({ phase:'options', fileInfo: predict });
      }
    }, 900);
  }

  function handleCompressionSelect(chosenOption) {
    const fileInfo = compressionDialog.fileInfo;
    setCompressionDialog(null);
    startUploadProgress(fileInfo, chosenOption);
  }

  function handleCompressionCancel() {
    setCompressionDialog(null);
  }

  function handleCompress(file) {    // Pick a mock predict seeded by the file's name, override filename/size to match the real file
    const base = MOCK_PREDICTS[mockPredictIdx.current % MOCK_PREDICTS.length];
    mockPredictIdx.current += 1;
    const predict = {
      ...base,
      filename: file.name,
      input_size_human: file.size ? fmtSize(file.size) : '—',
    };
    setCompressionDialog({ phase:'analyzing', fileInfo: predict });
    setTimeout(() => {
      setCompressionDialog({
        phase: predict.should_skip ? 'skip' : 'options',
        fileInfo: predict,
      });
    }, 900);
  }

  function handleMultiCompress() {
    const selectedFiles = files.filter(f => selected.has(f.id) && !f.folder);
    if (selectedFiles.length === 0) return;
    setMultiCompressDialog(selectedFiles);
  }

  function handleMultiCompressConfirm(perFile) {
    setMultiCompressDialog(null);
    const toCompress = Object.entries(perFile)
      .filter(([, v]) => v && v !== 'skip')
      .map(([id]) => files.find(f => f.id === Number(id)))
      .filter(Boolean);
    if (toCompress.length === 0) return;
    // Build uploads array directly
    let progs = toCompress.map(f => ({
      name: f.name,
      progress: 0,
      algo: MULTI_COMPRESS_OPTIONS.find(o => o.id === perFile[f.id])?.label || null,
    }));
    setUploads(progs);
    const interval = setInterval(() => {
      progs = progs.map(f => ({ ...f, progress: Math.min(100, f.progress + Math.random() * 28 + 8) }));
      setUploads([...progs]);
      if (progs.every(f => f.progress >= 100)) clearInterval(interval);
    }, 250);
  }

  const navLabel = SIDEBAR_NAV.find(n=>n.id===navId)?.label || 'My Vault';
  const selCount = selected.size;

  return (
    <div style={{ width:'100%', height:'100%', display:'flex', background:'var(--bg)', overflow:'hidden', animation:'fadeIn 0.3s ease' }}>

      {/* Sidebar */}
      <div style={{
        width:sidebarW, flexShrink:0, display:'flex', flexDirection:'column',
        borderRight:'1px solid var(--border)',
        background:'var(--surface)',
      }}>
        {/* Logo */}
        <div style={{
          padding:'18px 18px 14px',
          borderBottom:'1px solid var(--border)',
          display:'flex', alignItems:'center', gap:10,
        }}>
          <div style={{color:'var(--accent)'}}><VaultMark size={22}/></div>
          <span style={{ fontFamily:'var(--font-display)', fontSize:16, fontWeight:700, letterSpacing:'-0.02em' }}>TheVault</span>
        </div>

        {/* Upload button */}
        <div style={{ padding:'14px 12px', borderBottom:'1px solid var(--border)' }}>
          <button
            onClick={()=>notify('New directory created')}
            style={{
              width:'100%', padding:'9px 12px',
              background:'var(--bg)', color:'var(--accent)',
              border:'1px solid var(--accent-dim)', borderRadius:8,
              fontSize:13, fontWeight:600, cursor:'pointer', fontFamily:'var(--font-body)',
              display:'flex', alignItems:'center', justifyContent:'center', gap:7,
              transition:'all 0.15s',
            }}
            onMouseEnter={e=>{ e.currentTarget.style.borderColor='var(--accent)'; e.currentTarget.style.background='var(--accent-dim)'; }}
            onMouseLeave={e=>{ e.currentTarget.style.borderColor='var(--accent-dim)'; e.currentTarget.style.background='var(--bg)'; }}
          >
            <Icon name="newFolder" size={14}/>
            New Directory
          </button>
          <button
            onClick={handleUpload}
            style={{
              width:'100%', padding:'9px 12px', marginTop:8,
              background:'var(--accent)', color:'oklch(0.12 0.02 78)',
              border:'none', borderRadius:8, fontSize:13, fontWeight:600,
              cursor:'pointer', fontFamily:'var(--font-body)',
              display:'flex', alignItems:'center', justifyContent:'center', gap:7,
              transition:'opacity 0.15s',
            }}
            onMouseEnter={e=>e.currentTarget.style.opacity='0.88'}
            onMouseLeave={e=>e.currentTarget.style.opacity='1'}
          >
            <Icon name="upload" size={14}/>
            Upload Files
          </button>
        </div>

        {/* Nav */}
        <nav style={{ padding:'10px 8px', flex:1, overflowY:'auto' }}>
          {SIDEBAR_NAV.map(item => (
            <button
              key={item.id}
              onClick={()=>{ setNavId(item.id); setSelected(new Set()); setDetailFile(null); }}
              style={{
                display:'flex', alignItems:'center', gap:9,
                width:'100%', padding:'8px 10px', borderRadius:7,
                background: navId===item.id
                  ? (item.id==='squeeze' ? 'oklch(0.65 0.14 290 / 0.12)' : item.id==='trash' ? 'oklch(0.65 0.18 25 / 0.10)' : 'var(--accent-dim)')
                  : 'none',
                border: `1px solid ${navId===item.id
                  ? (item.id==='squeeze' ? 'oklch(0.65 0.14 290 / 0.3)' : item.id==='trash' ? 'oklch(0.65 0.18 25 / 0.25)' : 'oklch(0.72 0.14 78 / 0.2)')
                  : 'transparent'}`,
                cursor:'pointer', marginBottom:2,
                color: navId===item.id
                  ? (item.id==='squeeze' ? 'oklch(0.65 0.14 290)' : item.id==='trash' ? 'oklch(0.65 0.18 25)' : 'var(--accent)')
                  : item.id==='trash' ? 'oklch(0.55 0.10 25)' : 'var(--text-2)',
                fontSize:13, fontFamily:'var(--font-body)', textAlign:'left',
                fontWeight: navId===item.id ? 500 : 400,
                transition:'all 0.1s',
              }}
              onMouseEnter={e=>{ if(navId!==item.id) e.currentTarget.style.background='var(--surface2)'; }}
              onMouseLeave={e=>{ if(navId!==item.id) e.currentTarget.style.background='none'; }}
            >
              <Icon name={item.icon} size={15}/>
              {item.label}
            </button>
          ))}

        </nav>

        {/* Settings nav item */}
        <div style={{ padding:'0 8px 6px' }}>
          <button
            onClick={()=>{ setNavId('settings'); setSelected(new Set()); setDetailFile(null); }}
            style={{
              display:'flex', alignItems:'center', gap:9,
              width:'100%', padding:'8px 10px', borderRadius:7,
              background: navId==='settings' ? 'var(--accent-dim)' : 'none',
              border:`1px solid ${navId==='settings' ? 'oklch(0.72 0.14 78 / 0.2)' : 'transparent'}`,
              cursor:'pointer',
              color: navId==='settings' ? 'var(--accent)' : 'var(--text-2)',
              fontSize:13, fontFamily:'var(--font-body)', textAlign:'left',
              fontWeight: navId==='settings' ? 500 : 400,
              transition:'all 0.1s',
            }}
            onMouseEnter={e=>{ if(navId!=='settings') e.currentTarget.style.background='var(--surface2)'; }}
            onMouseLeave={e=>{ if(navId!=='settings') e.currentTarget.style.background='none'; }}
          >
            <Icon name="settings" size={15}/>
            Settings
          </button>
        </div>

        {/* User / storage */}
        <div style={{ padding:'12px', borderTop:'1px solid var(--border)' }}>
          <div style={{ padding:'10px', borderRadius:8, background:'var(--surface2)', border:'1px solid var(--border)', marginBottom:10 }}>
            <div style={{ fontSize:11, color:'var(--text-3)', textTransform:'uppercase', letterSpacing:'0.05em', marginBottom:8 }}>Storage</div>
            {(() => {
              const MIRROR_COLOR = 'oklch(0.65 0.14 200)';
              const rawSinks = vaultConfig?.sinks?.length
                ? vaultConfig.sinks.map(s => ({ type:'normal', mirrorOf:null, ...s }))
                : [{ id:0, type:'normal', mirrorOf:null, label:'Primary', path:'/mnt/vault' }];
              const MOCK_USED  = [28.4, 14.2, 61.7, 8.1, 22.9];
              const MOCK_TOTAL = [100,  50,   200,  80,  120 ];
              const normalSinks = rawSinks.filter(s => s.type === 'normal');
              const mirrorSinks = rawSinks.filter(s => s.type === 'mirror');

              return normalSinks.map((sink, i) => {
                const used  = MOCK_USED[i]  ?? 30;
                const total = MOCK_TOTAL[i] ?? 100;
                const pct   = (used / total * 100).toFixed(1);
                const isHigh = used / total > 0.8;
                const mirrors = mirrorSinks.filter(m => m.mirrorOf === sink.id);
                const label = sink.label || sink.path || `Sink ${i + 1}`;

                return (
                  <div key={sink.id ?? i} style={{ marginBottom: i < normalSinks.length - 1 || mirrors.length > 0 ? 8 : 0 }}>
                    {/* Normal sink row */}
                    <div style={{ marginBottom:4 }}>
                      <div style={{ display:'flex', justifyContent:'space-between', marginBottom:3 }}>
                        <div style={{ display:'flex', alignItems:'center', gap:5 }}>
                          <Icon name="folder" size={11} style={{color:'oklch(0.65 0.14 200)'}}/>
                          <span style={{ fontSize:11, color:'var(--text-2)', fontWeight:500, maxWidth:90, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{label}</span>
                        </div>
                        <span style={{ fontSize:10, color:'var(--text-3)' }}>{used} / {total} GB</span>
                      </div>
                      <div style={{ height:2, background:'var(--border)', borderRadius:1 }}>
                        <div style={{ width:`${pct}%`, height:'100%', borderRadius:1, background: isHigh ? 'var(--danger)' : 'var(--accent)', transition:'width 0.3s' }}/>
                      </div>
                    </div>

                    {/* Mirror sinks — indented */}
                    {mirrors.map((mirror, mi) => {
                      const mLabel = mirror.label || mirror.path || 'Mirror';
                      return (
                        <div key={mirror.id ?? `m${mi}`} style={{ display:'flex', gap:0, marginBottom: mi < mirrors.length - 1 ? 5 : 0 }}>
                          {/* Connector */}
                          <div style={{ width:16, flexShrink:0, display:'flex', flexDirection:'column', alignItems:'center' }}>
                            <div style={{ width:1, height:'50%', background:`${MIRROR_COLOR}30` }}/>
                            <div style={{ width:8, height:1, background:`${MIRROR_COLOR}30`, alignSelf:'flex-end' }}/>
                            <div style={{ width:1, height:'50%', background:'transparent' }}/>
                          </div>
                          <div style={{ flex:1 }}>
                            <div style={{ display:'flex', justifyContent:'space-between', marginBottom:3 }}>
                              <div style={{ display:'flex', alignItems:'center', gap:4 }}>
                                <Icon name="mirror" size={10} style={{color: MIRROR_COLOR, opacity:0.8}}/>
                                <span style={{ fontSize:10, color:'var(--text-3)', maxWidth:80, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{mLabel}</span>
                              </div>
                              <span style={{ fontSize:9, color:MIRROR_COLOR, opacity:0.7 }}>replica</span>
                            </div>
                            <div style={{ height:1.5, background:'var(--border)', borderRadius:1 }}>
                              <div style={{ width:`${pct}%`, height:'100%', borderRadius:1, background:`${MIRROR_COLOR}70`, transition:'width 0.3s' }}/>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                );
              });
            })()}
          </div>
          <div style={{ display:'flex', alignItems:'center', gap:9, marginTop:10, padding:'6px 4px' }}>
            <div style={{
              width:28, height:28, borderRadius:'50%', flexShrink:0,
              background:'var(--accent-dim)', border:'1px solid oklch(0.72 0.14 78 / 0.3)',
              display:'flex', alignItems:'center', justifyContent:'center', color:'var(--accent)',
            }}>
              <Icon name="user" size={13}/>
            </div>
            <div style={{ flex:1, overflow:'hidden' }}>
              <div style={{ fontSize:12, fontWeight:500, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>admin@vault.local</div>
              <div style={{ fontSize:11, color:'var(--text-3)' }}>Owner</div>
            </div>
            <button onClick={()=>{ try { localStorage.removeItem('vault_screen'); } catch{} onLogout(); }} style={{ background:'none', border:'none', cursor:'pointer', color:'var(--text-3)', display:'flex', padding:3, borderRadius:4, transition:'color 0.15s' }}
              title="Log out"
              onMouseEnter={e=>e.currentTarget.style.color='var(--danger)'}
              onMouseLeave={e=>e.currentTarget.style.color='var(--text-3)'}
            >
              <Icon name="x" size={14}/>
            </button>
          </div>
        </div>
      </div>

      {/* Main */}
      <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden', minWidth:0 }}>

        {/* Topbar */}
        <div style={{
          padding:'0 20px', height:57,
          display:'flex', alignItems:'center', gap:12,
          borderBottom:'1px solid var(--border)', flexShrink:0,
        }}>
          {/* Breadcrumb */}
          <div style={{ display:'flex', alignItems:'center', gap:4, fontSize:13, color:'var(--text-2)', marginRight:4 }}>
            <span style={{ color:'var(--text-3)', cursor:'pointer' }} onClick={()=>setNavId('home')}>My Vault</span>
            {vaultName && <><Icon name="chevronRight" size={13} style={{color:'var(--text-3)'}}/><span style={{ fontWeight:500, color:'var(--text)' }}>{vaultName}</span></>}
          </div>

          {/* Search */}
          <div style={{ flex:1, maxWidth:340, position:'relative' }}>
            <div style={{ position:'absolute', left:11, top:'50%', transform:'translateY(-50%)', color:'var(--text-3)', pointerEvents:'none' }}>
              <Icon name="search" size={14}/>
            </div>
            <input
              value={search}
              onChange={e=>setSearch(e.target.value)}
              placeholder="Search files…"
              style={{
                width:'100%', padding:'7px 12px 7px 34px',
                background:'var(--surface)', border:'1px solid var(--border)',
                borderRadius:8, fontSize:13, color:'var(--text)',
                outline:'none', fontFamily:'var(--font-body)',
                transition:'border-color 0.15s',
              }}
              onFocus={e=>e.target.style.borderColor='var(--border2)'}
              onBlur={e=>e.target.style.borderColor='var(--border)'}
            />
          </div>

          <div style={{ flex:1 }}/>

          {/* Actions */}
          <button style={{ background:'none', border:'none', cursor:'pointer', color:'var(--text-2)', display:'flex', alignItems:'center', padding:'6px', borderRadius:6 }}>
            <Icon name="bell" size={16}/>
          </button>

          {/* View toggle */}
          <div style={{ display:'flex', background:'var(--surface)', border:'1px solid var(--border)', borderRadius:8, padding:2 }}>
            {['grid','list'].map(v => (
              <button key={v} onClick={()=>setView(v)} style={{
                padding:'5px 10px', borderRadius:6, border:'none', cursor:'pointer',
                background: view===v ? 'var(--surface2)' : 'transparent',
                color: view===v ? 'var(--text)' : 'var(--text-3)',
                display:'flex', alignItems:'center', transition:'all 0.15s',
              }}>
                <Icon name={v} size={14}/>
              </button>
            ))}
          </div>
        </div>

        {/* Selection bar */}
        {selCount > 0 && (
          <div style={{
            padding:'8px 20px', display:'flex', alignItems:'center', gap:10,
            background:'var(--accent-dim)', borderBottom:'1px solid oklch(0.72 0.14 78 / 0.2)',
            animation:'fadeIn 0.15s ease',
          }}>
            <span style={{ fontSize:13, fontWeight:500, color:'var(--accent)' }}>{selCount} selected</span>
            <div style={{ flex:1 }}/>
            {[
              { icon:'download', label:'Download' },
              { icon:'move', label:'Move' },
              { icon:'copy', label:'Copy' },
              { icon:'share', label:'Share' },
            ].map(a => (
              <button key={a.icon} onClick={()=>notify(`${a.label} — ${selCount} file${selCount>1?'s':''}…`)} style={{
                display:'flex', alignItems:'center', gap:6, padding:'5px 10px',
                background:'var(--surface)', border:'1px solid var(--border)',
                borderRadius:7, cursor:'pointer', fontSize:12, color:'var(--text-2)',
                fontFamily:'var(--font-body)',
              }}>
                <Icon name={a.icon} size={12}/>
                {a.label}
              </button>
            ))}
            {/* Compress — solo se tutti i selezionati sono file (non cartelle) */}
            {(() => {
              const allFiles = [...selected].every(id => {
                const f = files.find(x => x.id === id);
                return f && !f.folder;
              });
              return allFiles && selCount >= 2 && (
                <button onClick={handleMultiCompress} style={{
                  display:'flex', alignItems:'center', gap:6, padding:'5px 10px',
                  background:'oklch(0.65 0.14 290 / 0.1)', border:'1px solid oklch(0.65 0.14 290 / 0.35)',
                  borderRadius:7, cursor:'pointer', fontSize:12, color:'oklch(0.75 0.12 290)',
                  fontFamily:'var(--font-body)', transition:'all 0.15s',
                }}
                onMouseEnter={e=>{ e.currentTarget.style.background='oklch(0.65 0.14 290 / 0.18)'; e.currentTarget.style.borderColor='oklch(0.65 0.14 290 / 0.6)'; }}
                onMouseLeave={e=>{ e.currentTarget.style.background='oklch(0.65 0.14 290 / 0.1)'; e.currentTarget.style.borderColor='oklch(0.65 0.14 290 / 0.35)'; }}
                >
                  <Icon name="squeeze" size={12} style={{color:'oklch(0.65 0.14 290)'}}/>
                  Compress
                </button>
              );
            })()}
            <button onClick={()=>notify(`Deleted ${selCount} file${selCount>1?'s':''}`)} style={{
              display:'flex', alignItems:'center', gap:6, padding:'5px 10px',
              background:'oklch(0.65 0.18 25 / 0.1)', border:'1px solid oklch(0.65 0.18 25 / 0.25)',
              borderRadius:7, cursor:'pointer', fontSize:12, color:'var(--danger)',
              fontFamily:'var(--font-body)',
            }}>
              <Icon name="trash" size={12}/>
              Delete
            </button>
            <button onClick={()=>setSelected(new Set())} style={{ background:'none', border:'none', cursor:'pointer', color:'var(--text-3)', display:'flex', marginLeft:4 }}>
              <Icon name="x" size={14}/>
            </button>
          </div>
        )}

        {/* Content */}
        <div style={{ flex:1, display:'flex', overflow:'hidden' }}>
          {navId === 'settings' ? (
            <SettingsPanel vaultConfig={vaultConfig} onSave={(cfg) => {
              const next = {...vaultConfig, ...cfg};
              try { localStorage.setItem('vault_config', JSON.stringify(next)); } catch {}
              setVaultConfig(next);
              notify('Settings saved');
            }}/>
          ) : navId === 'squeeze' ? (
            <SqueezeView/>
          ) : navId === 'trash' ? (
            <TrashView notify={notify}/>
          ) : (
            <>
            <div style={{ flex:1, overflowY:'auto', padding:'20px' }}>

            {view === 'grid' ? (
              <div style={{
                display:'grid',
                gridTemplateColumns: tweaks.compactDensity
                  ? 'repeat(auto-fill, minmax(130px, 1fr))'
                  : 'repeat(auto-fill, minmax(160px, 1fr))',
                gap: tweaks.compactDensity ? 10 : 14,
              }}>
                {files.map(f => (
                  <FileCard
                    key={f.id} file={f}
                    selected={selected.has(f.id)}
                    onSelect={()=>toggleSelect(f.id)}
                    onOpen={()=>setDetailFile(f)}
                    onContextMenu={e=>showCtx(e,f)}
                    tweaks={tweaks}
                  />
                ))}
              </div>
            ) : (
              <div>
                {/* List header */}
                <div style={{
                  display:'flex', alignItems:'center', gap:12,
                  padding:'6px 14px', marginBottom:6,
                  fontSize:11, color:'var(--text-3)', textTransform:'uppercase', letterSpacing:'0.05em',
                }}>
                  <div style={{width:16+30+12, flexShrink:0}}/>
                  <div style={{ flex:1 }}>Name</div>
                  <div style={{ width:80, textAlign:'right' }}>Size</div>
                  <div style={{ width:100, textAlign:'right' }}>Modified</div>
                  <div style={{ width:38 }}/>
                </div>
                {files.map(f => (
                  <FileRow
                    key={f.id} file={f}
                    selected={selected.has(f.id)}
                    onSelect={()=>toggleSelect(f.id)}
                    onOpen={()=>setDetailFile(f)}
                    onContextMenu={e=>showCtx(e,f)}
                  />
                ))}
              </div>
            )}
          </div>

          {/* Detail Panel */}
          {detailFile && <DetailPanel file={detailFile} onClose={()=>setDetailFile(null)} onCompress={handleCompress}/>}
          </>
          )}
        </div>
      </div>

      {/* Activity Drawer */}
      {navId !== 'settings' && navId !== 'squeeze' && navId !== 'trash' && <ActivityDrawer detailOpen={!!detailFile}/>}

      {/* Context menu */}
      {contextMenu && <ContextMenu {...contextMenu} onClose={()=>setContextMenu(null)}/>}

      {/* Multi-file compress dialog */}
      {multiCompressDialog && (
        <MultiCompressDialog
          files={multiCompressDialog}
          onConfirm={handleMultiCompressConfirm}
          onCancel={() => setMultiCompressDialog(null)}
        />
      )}

      {/* Compression dialog */}
      {compressionDialog && (
        <CompressionDialog
          phase={compressionDialog.phase}
          fileInfo={compressionDialog.fileInfo}
          onSelect={handleCompressionSelect}
          onCancel={handleCompressionCancel}
        />
      )}

      {/* Upload progress */}
      {uploads && <UploadBanner files={uploads} onDismiss={()=>setUploads(null)}/>}

      {/* Toast */}
      {notification && (
        <div style={{
          position:'fixed', bottom:24, left:'50%', transform:'translateX(-50%)',
          background:'var(--surface2)', border:'1px solid var(--border2)',
          borderRadius:8, padding:'10px 18px', fontSize:13,
          boxShadow:'0 6px 24px rgba(0,0,0,0.4)',
          animation:'fadeUp 0.2s ease both',
          display:'flex', alignItems:'center', gap:8, zIndex:600,
          whiteSpace:'nowrap',
        }}>
          <Icon name="check" size={13} style={{color:'oklch(0.65 0.18 145)'}}/>
          {notification}
        </div>
      )}
    </div>
  );
}

// ── TWEAKS PANEL ─────────────────────────────────────────────────────────────
function TweaksPanel({ tweaks, setTweaks, visible }) {
  function set(key, val) {
    const next = {...tweaks, [key]: val};
    setTweaks(next);
    window.parent.postMessage({ type:'__edit_mode_set_keys', edits: {[key]: val} }, '*');
  }
  const hues = [78, 200, 290, 145, 25, 320];
  const hueLabels = ['Amber', 'Cyan', 'Violet', 'Green', 'Red', 'Pink'];
  return (
    <div style={{
      position:'fixed', bottom:20, right:20, zIndex:800,
      background:'var(--surface2)', border:'1px solid var(--border2)',
      borderRadius:14, padding:'18px', width:240,
      boxShadow:'0 12px 40px rgba(0,0,0,0.5)',
      display: visible ? 'block' : 'none',
      animation: visible ? 'scaleIn 0.2s ease both' : 'none',
    }}>
      <div style={{ fontSize:12, fontWeight:600, letterSpacing:'0.05em', textTransform:'uppercase', color:'var(--text-2)', marginBottom:14 }}>Tweaks</div>

      {/* Accent color */}
      <div style={{ marginBottom:14 }}>
        <div style={{ fontSize:12, color:'var(--text-3)', marginBottom:8 }}>Accent Color</div>
        <div style={{ display:'flex', gap:6 }}>
          {hues.map((h,i) => (
            <button key={h} title={hueLabels[i]} onClick={()=>{
              set('accentHue', h);
              document.documentElement.style.setProperty('--accent', `oklch(0.72 0.14 ${h})`);
              document.documentElement.style.setProperty('--accent-dim', `oklch(0.72 0.14 ${h} / 0.15)`);
              document.documentElement.style.setProperty('--accent-dim2', `oklch(0.72 0.14 ${h} / 0.08)`);
            }} style={{
              width:22, height:22, borderRadius:6, border:`2px solid ${tweaks.accentHue===h ? 'white' : 'transparent'}`,
              background:`oklch(0.72 0.14 ${h})`, cursor:'pointer', flexShrink:0,
            }}/>
          ))}
        </div>
      </div>

      {/* Default view */}
      <div style={{ marginBottom:14 }}>
        <div style={{ fontSize:12, color:'var(--text-3)', marginBottom:8 }}>Default View</div>
        <div style={{ display:'flex', gap:6 }}>
          {['grid','list'].map(v => (
            <button key={v} onClick={()=>set('defaultView',v)} style={{
              flex:1, padding:'6px 0', borderRadius:7, border:`1px solid ${tweaks.defaultView===v ? 'var(--border2)' : 'var(--border)'}`,
              background: tweaks.defaultView===v ? 'var(--surface)' : 'transparent',
              color: tweaks.defaultView===v ? 'var(--text)' : 'var(--text-3)',
              cursor:'pointer', fontSize:12, display:'flex', alignItems:'center', justifyContent:'center', gap:5,
              fontFamily:'var(--font-body)',
            }}>
              <Icon name={v} size={12}/>
              {v.charAt(0).toUpperCase()+v.slice(1)}
            </button>
          ))}
        </div>
      </div>

      {/* Sidebar width */}
      <div style={{ marginBottom:14 }}>
        <div style={{ display:'flex', justifyContent:'space-between', marginBottom:8 }}>
          <span style={{ fontSize:12, color:'var(--text-3)' }}>Sidebar Width</span>
          <span style={{ fontSize:11, color:'var(--text-3)' }}>{tweaks.sidebarWidth}px</span>
        </div>
        <input type="range" min={180} max={280} step={10} value={tweaks.sidebarWidth}
          onChange={e=>set('sidebarWidth', parseInt(e.target.value))}
          style={{ width:'100%', accentColor:'var(--accent)', cursor:'pointer' }}
        />
      </div>

      {/* Compact density */}
      <div>
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>
          <span style={{ fontSize:12, color:'var(--text-3)' }}>Compact Density</span>
          <button onClick={()=>set('compactDensity', !tweaks.compactDensity)} style={{
            width:36, height:20, borderRadius:10, border:'none', cursor:'pointer',
            background: tweaks.compactDensity ? 'var(--accent)' : 'var(--border2)',
            position:'relative', transition:'background 0.2s', flexShrink:0,
          }}>
            <div style={{
              position:'absolute', top:2, left: tweaks.compactDensity ? 18 : 2,
              width:16, height:16, borderRadius:'50%', background:'white',
              transition:'left 0.2s', boxShadow:'0 1px 3px rgba(0,0,0,0.3)',
            }}/>
          </button>
        </div>
      </div>
    </div>
  );
}

// ── APP ROOT ─────────────────────────────────────────────────────────────────
function App() {
  const isFirstLogin = (() => { try { return !localStorage.getItem('vault_pwd_changed'); } catch { return true; } })();
  const isSetupDone = (() => { try { return !!localStorage.getItem('vault_config'); } catch { return false; } })();

  const [screen, setScreen] = useState(() => {
    try { return localStorage.getItem('vault_screen') || 'login'; } catch { return 'login'; }
  });
  const [vaultConfig, setVaultConfig] = useState(() => {
    try { return JSON.parse(localStorage.getItem('vault_config') || 'null'); } catch { return null; }
  });
  const [tweaksVisible, setTweaksVisible] = useState(false);
  const [tweaks, setTweaks] = useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem('vault_tweaks') || '{}');
      return { ...TWEAK_DEFAULTS, ...saved };
    } catch { return TWEAK_DEFAULTS; }
  });

  useEffect(() => {
    try { localStorage.setItem('vault_screen', screen); } catch {}
  }, [screen]);

  useEffect(() => {
    try { localStorage.setItem('vault_tweaks', JSON.stringify(tweaks)); } catch {}
    // apply accent
    document.documentElement.style.setProperty('--accent', `oklch(0.72 0.14 ${tweaks.accentHue})`);
    document.documentElement.style.setProperty('--accent-dim', `oklch(0.72 0.14 ${tweaks.accentHue} / 0.15)`);
    document.documentElement.style.setProperty('--accent-dim2', `oklch(0.72 0.14 ${tweaks.accentHue} / 0.08)`);
  }, [tweaks]);

  // edit mode messaging
  useEffect(() => {
    function handler(e) {
      if (e.data?.type === '__activate_edit_mode')   setTweaksVisible(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksVisible(false);
    }
    window.addEventListener('message', handler);
    window.parent.postMessage({ type:'__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  return (
    <div style={{ width:'100%', height:'100%' }}>
      {screen === 'login' && (
        <LoginScreen
          isFirstLogin={isFirstLogin}
          onFirstLogin={() => setScreen('change-password')}
          onLogin={() => setScreen('dashboard')}
        />
      )}
      {screen === 'change-password' && (
        <ChangePasswordScreen onDone={() => setScreen('setup')}/>
      )}
      {screen === 'setup' && (
        <SetupWizard onDone={(cfg) => { setVaultConfig(cfg); setScreen('dashboard'); }}/>
      )}
      {screen === 'dashboard' && (
        <Dashboard tweaks={tweaks} vaultName={vaultConfig?.vaultName} vaultConfig={vaultConfig} setVaultConfig={setVaultConfig} onLogout={()=>setScreen('login')}/>
      )}
      {screen === 'dashboard' && (
        <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} visible={tweaksVisible}/>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
