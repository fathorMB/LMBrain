                  }}
                >
                  {type === opt.id && (
                    <div style={{ position:'absolute', top:8, right:8, width:12, height:12, borderRadius:'50%', background: opt.color, display:'flex', alignItems:'center', justifyContent:'center' }}>
                      <svg viewBox="0 0 10 10" width="7" height="7"><polyline points="2,5 4,7.5 8,3" fill="none" stroke="oklch(0.12 0.02 78)" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>
                    </div>
                  )}
                  <div style={{ display:'flex', alignItems:'center', gap:7, marginBottom:5 }}>
                    <Icon name={opt.icon} size={14} style={{ color: type === opt.id ? opt.color : 'var(--text-2)' }}/>
                    <span style={{ fontSize:13, fontWeight:600, color: type === opt.id ? opt.color : 'var(--text)' }}>{opt.label}</span>
                  </div>
                  <div style={{ fontSize:11, color:'var(--text-3)', lineHeight:1.4 }}>{opt.desc}</div>
                  {opt.disabled && (
                    <div style={{ fontSize:10, color:'var(--text-3)', marginTop:4, fontStyle:'italic' }}>Aggiungi prima un sink normale</div>
                  )}
                </div>
              ))}
            </div>
          </div>

          {/* Cloud — Google Drive connect */}
          {type === 'cloud' && (
            <div style={{ marginBottom:16, animation:'fadeIn 0.2s ease both' }}>
              {/* OAuth connect area */}
              {!gdConnected ? (
                <div style={{ padding:'18px 16px', background:`${CLOUD_COLOR}08`, border:`1px solid ${CLOUD_COLOR}28`, borderRadius:10, display:'flex', flexDirection:'column', alignItems:'center', gap:12, textAlign:'center' }}>
                  <Icon name="gdrive" size={32}/>
                  <div>
                    <div style={{ fontSize:13, fontWeight:600, marginBottom:3 }}>Connetti Google Drive</div>
                    <div style={{ fontSize:11, color:'var(--text-3)', lineHeight:1.5 }}>Collega il tuo account Google per usare Drive come sink cloud (mirror-only).</div>
                  </div>
                  <button
                    onClick={simulateGdAuth}
                    disabled={gdConnecting}
                    style={{ display:'flex', alignItems:'center', gap:8, padding:'9px 18px', borderRadius:8, border:`1px solid ${CLOUD_COLOR}50`, background: gdConnecting ? 'var(--surface2)' : `${CLOUD_COLOR}14`, color: CLOUD_COLOR, cursor: gdConnecting ? 'default' : 'pointer', fontSize:13, fontWeight:600, fontFamily:'var(--font-body)', transition:'all 0.15s' }}
                  >
                    {gdConnecting ? (
                      <>
                        <div style={{ width:14, height:14, border:`2px solid ${CLOUD_COLOR}40`, borderTopColor:CLOUD_COLOR, borderRadius:'50%', animation:'spin 0.8s linear infinite' }}/>
                        Connessione…
                      </>
                    ) : (
                      <>
                        <Icon name="gdrive" size={14}/>
                        Accedi con Google
                      </>
                    )}
                  </button>
                </div>
              ) : (
                <div style={{ padding:'12px 14px', background:`${CLOUD_COLOR}08`, border:`1px solid ${CLOUD_COLOR}35`, borderRadius:10 }}>
                  {/* Account row */}
                  <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:14 }}>
                    <div style={{ width:32, height:32, borderRadius:'50%', background:`${CLOUD_COLOR}20`, border:`1px solid ${CLOUD_COLOR}40`, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
                      <Icon name="gdrive" size={16}/>
                    </div>
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ fontSize:12, fontWeight:600, color:CLOUD_COLOR }}>{gdAccount}</div>
                      <div style={{ fontSize:11, color:'var(--text-3)' }}>Google Drive connesso</div>
                    </div>
                    <button onClick={gdDisconnect} style={{ background:'none', border:'none', cursor:'pointer', color:'var(--text-3)', fontSize:11, fontFamily:'var(--font-body)', padding:'3px 8px', borderRadius:6, border:'1px solid var(--border)', transition:'color 0.15s' }}
                      onMouseEnter={e=>e.currentTarget.style.color='var(--danger)'}
                      onMouseLeave={e=>e.currentTarget.style.color='var(--text-3)'}
                    >Disconnetti</button>
                  </div>

                  {/* Folder URL */}
                  <label style={{ display:'block', fontSize:11, color:'var(--text-3)', marginBottom:6, textTransform:'uppercase', letterSpacing:'0.04em' }}>
                    Link cartella Drive <span style={{color:'var(--danger)'}}>*</span>
                  </label>
                  <input
                    value={gdFolder}
                    onChange={e => handleGdFolderChange(e.target.value)}
                    placeholder="https://drive.google.com/drive/folders/…"
                    autoFocus
                    style={{ width:'100%', padding:'9px 12px', background:'var(--surface)', border:`1px solid ${CLOUD_COLOR}40`, borderRadius:8, color:'var(--text)', outline:'none', fontFamily:'monospace', fontSize:11, transition:'border-color 0.15s' }}
                    onFocus={e=>e.target.style.borderColor=CLOUD_COLOR}
                    onBlur={e=>e.target.style.borderColor=`${CLOUD_COLOR}40`}
                  />
                  <div style={{ marginTop:8, display:'flex', alignItems:'center', gap:6 }}>
                    <div style={{ width:6, height:6, borderRadius:'50%', background:CLOUD_COLOR, opacity:0.7 }}/>
                    <span style={{ fontSize:11, color:'var(--text-3)' }}>Sola replica in uscita dal vault verso Drive (mirror-only).</span>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* Mirror source picker */}
          {type === 'mirror' && (
            <div style={{ marginBottom:16, padding:'12px 14px', background:`${MIRROR_COLOR}08`, border:`1px solid ${MIRROR_COLOR}28`, borderRadius:10, animation:'fadeIn 0.2s ease both' }}>
              <label style={{ display:'block', fontSize:11, color:'var(--text-3)', marginBottom:6, textTransform:'uppercase', letterSpacing:'0.04em' }}>
                Mirror di <span style={{color:'var(--danger)'}}>*</span>
              </label>
              <select
                value={mirrorOf ?? ''}
                onChange={e => setMirrorOf(Number(e.target.value))}
                style={{ width:'100%', padding:'9px 12px', background:'var(--surface)', border:`1px solid ${MIRROR_COLOR}40`, borderRadius:8, color:'var(--text)', fontSize:13, fontFamily:'var(--font-body)', outline:'none', cursor:'pointer' }}
              >
                {normalSinks.map(s => (
                  <option key={s.id} value={s.id}>{s.label || s.path || `Sink #${s.id}`}</option>
                ))}
              </select>
              <div style={{ marginTop:8, display:'flex', alignItems:'center', gap:6 }}>
                <Icon name="mirror" size={11} style={{color: MIRROR_COLOR}}/>
                <span style={{ fontSize:11, color: MIRROR_COLOR }}>Ogni modifica sul sink sorgente viene replicata qui in tempo reale, e viceversa.</span>
              </div>
            </div>
          )}

          {/* Path — hidden for cloud */}
          {type !== 'cloud' && (
          <div style={{ marginBottom:12 }}>
            <label style={{ display:'block', fontSize:11, color:'var(--text-3)', marginBottom:6, textTransform:'uppercase', letterSpacing:'0.04em' }}>
              Directory Path <span style={{color:'var(--danger)'}}>*</span>
            </label>
            <input
              value={path}
              onChange={e => setPath(e.target.value)}
              placeholder={type === 'mirror' ? '/mnt/mirror/cold' : '/mnt/data/vault'}
              autoFocus
              style={{ ...inputBase, fontFamily:'monospace', fontSize:12 }}
              onFocus={e => e.target.style.borderColor = type === 'mirror' ? 'oklch(0.65 0.14 200)' : 'var(--accent)'}
              onBlur={e => e.target.style.borderColor = 'var(--border)'}
            />
          </div>
          )}

          {/* Label */}
          <div style={{ marginBottom:22 }}>
            <label style={{ display:'block', fontSize:11, color:'var(--text-3)', marginBottom:6, textTransform:'uppercase', letterSpacing:'0.04em' }}>
              Label <span style={{color:'var(--text-3)', fontWeight:400}}>(opzionale)</span>
            </label>
            <input
              value={label}
              onChange={e => setLabel(e.target.value)}
              placeholder={type === 'mirror' ? 'es. Cold Mirror, Offsite Backup…' : 'es. Primary Storage, Media Drive…'}
              style={inputBase}
              onFocus={e => e.target.style.borderColor = type === 'mirror' ? 'oklch(0.65 0.14 200)' : 'var(--accent)'}
              onBlur={e => e.target.style.borderColor = 'var(--border)'}
            />
          </div>

          {/* Actions */}
          <div style={{ display:'flex', justifyContent:'flex-end', gap:10 }}>
            <button onClick={onCancel} style={{ padding:'9px 18px', background:'none', border:'1px solid var(--border2)', borderRadius:8, fontSize:13, color:'var(--text-2)', cursor:'pointer', fontFamily:'var(--font-body)' }}>Annulla</button>
            <button
              onClick={handleConfirm}
              disabled={!canConfirm}
              style={{ padding:'9px 20px', background: canConfirm ? (type === 'cloud' ? CLOUD_COLOR : type === 'mirror' ? 'oklch(0.65 0.14 200)' : 'var(--accent)') : 'var(--border)', border:'none', borderRadius:8, fontSize:13, fontWeight:600, color: canConfirm ? 'oklch(0.10 0.01 260)' : 'var(--text-3)', cursor: canConfirm ? 'pointer' : 'not-allowed', fontFamily:'var(--font-body)', transition:'all 0.15s' }}
            >
              Aggiungi Sink
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── SETTINGS PANEL ───────────────────────────────────────────────────────────
function SettingsPanel({ vaultConfig, onSave }) {
  const cfg = vaultConfig || { sinks: [{ id: Date.now(), path: '', label: '' }], squeezeMode: false };

  const [sinks, setSinks] = useState(
    (cfg.sinks || [{ id: Date.now(), path: '', label: '' }])
      .map(s => ({ type: 'normal', mirrorOf: null, ...s }))
  );
  const [squeezeMode, setSqueezeMode] = useState(cfg.squeezeMode || false);
  const [dirty, setDirty] = useState(false);
  const [browserFor, setBrowserFor] = useState(null);
  const [addDialogOpen, setAddDialogOpen] = useState(false);
  const [sinkDeleteError, setSinkDeleteError] = useState(null);

  // ── Users state ────────────────────────────────────────────────────────────
  const OWNER = { id:0, email:'admin@vault.local', name:'Admin', role:'owner', permissions:{}, createdAt: new Date('2026-01-01') };
  const [users, setUsers] = useState([
    { id:1, email:'luca.b@studio.io',    name:'Luca Bianchi',   role:'admin',  permissions:{ 1:'full', 2:'full'  }, createdAt: new Date('2026-02-10') },
    { id:2, email:'sara.v@studio.io',    name:'Sara Verdi',     role:'member', permissions:{ 1:'write',2:'read'  }, createdAt: new Date('2026-03-04') },
    { id:3, email:'guest@external.com',  name:'Guest User',     role:'viewer', permissions:{ 1:'read', 2:'none'  }, createdAt: new Date('2026-04-12') },
  ]);
  const [inviteDialogOpen, setInviteDialogOpen] = useState(false);
  const [deleteUserId, setDeleteUserId]         = useState(null);
  const [editPermUser, setEditPermUser]         = useState(null); // user id being edited inline // sink id that can't be deleted

  function markDirty() { setDirty(true); }

  function addSink() { setAddDialogOpen(true); }
  function handleAddSinkConfirm(newSink) { setSinks(s => [...s, newSink]); setAddDialogOpen(false); markDirty(); }

  function removeSink(id) {
    const hasMirrors = sinks.some(s => s.type === 'mirror' && s.mirrorOf === id);
    if (hasMirrors) {
      setSinkDeleteError(id);
      setTimeout(() => setSinkDeleteError(null), 3500);
      return;
    }
    setSinks(s => s.filter(x => x.id !== id));
    markDirty();
  }

  function updateSink(id, field, value) { setSinks(s => s.map(x => x.id === id ? { ...x, [field]: value } : x)); markDirty(); }

  const inputStyle = {
    width:'100%', padding:'10px 13px',
    background:'var(--surface)', border:'1px solid var(--border)',
    borderRadius:8, fontSize:13, color:'var(--text)',
    outline:'none', transition:'border-color 0.15s', fontFamily:'var(--font-body)',
  };

  const canSave = sinks.length > 0 && sinks.every(s => s.path.trim().length > 0 && (s.type === 'normal' || s.mirrorOf !== null));

  return (
    <div style={{ flex:1, overflowY:'auto', padding:'32px 36px' }}>
      <div style={{ maxWidth:640 }}>

        {/* Header */}
        <div style={{ marginBottom:32 }}>
          <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:6 }}>
            <div style={{ width:32, height:32, borderRadius:9, background:'var(--accent-dim)', border:'1px solid oklch(0.72 0.14 78 / 0.25)', display:'flex', alignItems:'center', justifyContent:'center', color:'var(--accent)' }}>
              <Icon name="settings" size={16}/>
            </div>
            <h1 style={{ fontFamily:'var(--font-display)', fontSize:20, fontWeight:700, letterSpacing:'-0.02em' }}>Settings</h1>
          </div>
          <p style={{ fontSize:13, color:'var(--text-3)', marginLeft:42, lineHeight:1.55 }}>
            Manage your vault configuration. Changes take effect immediately after saving.
          </p>
        </div>

        {/* Section: File Sinks */}
        <section style={{ marginBottom:32 }}>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:14 }}>
            <div>
              <h2 style={{ fontSize:14, fontWeight:600, marginBottom:2 }}>File System Sinks</h2>
              <p style={{ fontSize:12, color:'var(--text-3)' }}>Directories on disk where the vault stores files.</p>
            </div>
            <button onClick={addSink} style={{
              display:'flex', alignItems:'center', gap:6,
              padding:'7px 13px', borderRadius:8,
              background:'var(--surface2)', border:'1px solid var(--border2)',
              color:'var(--text-2)', cursor:'pointer', fontSize:12,
              fontFamily:'var(--font-body)', transition:'all 0.15s', flexShrink:0,
            }}
            onMouseEnter={e=>{ e.currentTarget.style.borderColor='var(--accent)'; e.currentTarget.style.color='var(--accent)'; }}
            onMouseLeave={e=>{ e.currentTarget.style.borderColor='var(--border2)'; e.currentTarget.style.color='var(--text-2)'; }}
            >
              <Icon name="plus" size={12}/>
              Add sink
            </button>
          </div>

          {/* Grouped sink list */}
          {(() => {
            const MIRROR_COLOR = 'oklch(0.65 0.14 200)';
            const normalSinks = sinks.filter(s => s.type !== 'mirror' && s.type !== 'cloud');
            const mirrorSinks = sinks.filter(s => s.type === 'mirror');
            const cloudSinks  = sinks.filter(s => s.type === 'cloud');

            const SinkCard = ({ sink, isMirror = false }) => {
              const isCloud  = sink.type === 'cloud';
              const hasError = sinkDeleteError === sink.id;
              const sourceSink = isMirror ? sinks.find(s => s.id === sink.mirrorOf) : null;
              const CLOUD_COLOR = 'oklch(0.60 0.16 250)';
              const cardColor = isCloud ? CLOUD_COLOR : isMirror ? MIRROR_COLOR : null;
              const borderColor = hasError ? 'var(--danger)' : isCloud ? `${CLOUD_COLOR}40` : isMirror ? `${MIRROR_COLOR}40` : 'var(--border)';
              const bgColor = isCloud ? `${CLOUD_COLOR}06` : isMirror ? `${MIRROR_COLOR}06` : 'var(--surface)';

              if (isCloud) {
                const cloud = sink.cloud || {};
                return (
                  <div style={{ background:bgColor, border:`1px solid ${borderColor}`, borderRadius:10, padding:'14px 16px', animation:'fadeUp 0.2s ease both' }}>
                    <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:12 }}>
                      <div style={{ width:22, height:22, borderRadius:6, background:`${CLOUD_COLOR}18`, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
                        <Icon name="gdrive" size={13}/>
                      </div>
                      <span style={{ fontSize:12, fontWeight:600, color:CLOUD_COLOR }}>Cloud Sink · Google Drive</span>
                      <span style={{ fontSize:10, fontWeight:600, letterSpacing:'0.05em', textTransform:'uppercase', color:CLOUD_COLOR, background:`${CLOUD_COLOR}12`, border:`1px solid ${CLOUD_COLOR}30`, borderRadius:4, padding:'1px 6px', marginLeft:2 }}>mirror-only</span>
                      <button
                        onClick={() => removeSink(sink.id)}
                        title="Elimina sink"
                        style={{ marginLeft:'auto', background:'none', border:'none', cursor:'pointer', color:'var(--text-3)', display:'flex', padding:4, borderRadius:4, transition:'color 0.15s', flexShrink:0 }}
                        onMouseEnter={e=>e.currentTarget.style.color='var(--danger)'}
                        onMouseLeave={e=>e.currentTarget.style.color='var(--text-3)'}
                      ><Icon name="trash" size={13}/></button>
                    </div>

                    {/* Account row */}
                    <div style={{ display:'flex', alignItems:'center', gap:8, padding:'8px 10px', background:`${CLOUD_COLOR}08`, border:`1px solid ${CLOUD_COLOR}20`, borderRadius:8, marginBottom:10 }}>
                      <div style={{ width:24, height:24, borderRadius:'50%', background:`${CLOUD_COLOR}20`, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
                        <Icon name="gdrive" size={13}/>
                      </div>
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ fontSize:12, fontWeight:600, color:CLOUD_COLOR, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{cloud.account || sink.label || 'Google Drive'}</div>
                        <div style={{ fontSize:11, color:'var(--text-3)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{cloud.folderUrl || sink.path}</div>
                      </div>
                      <div style={{ display:'flex', alignItems:'center', gap:4, flexShrink:0 }}>
                        <div style={{ width:6, height:6, borderRadius:'50%', background:'oklch(0.65 0.14 145)', boxShadow:`0 0 6px oklch(0.65 0.14 145 / 0.6)` }}/>
                        <span style={{ fontSize:10, color:'oklch(0.65 0.14 145)' }}>Connesso</span>
                      </div>
                    </div>

                    {/* Label */}
                    <div>
                      <label style={{ display:'block', fontSize:11, color:'var(--text-3)', marginBottom:6, textTransform:'uppercase', letterSpacing:'0.04em' }}>
                        Label <span style={{color:'var(--text-3)', fontWeight:400}}>(opzionale)</span>
                      </label>
                      <input
                        value={sink.label}
                        onChange={e => updateSink(sink.id, 'label', e.target.value)}
                        placeholder="es. Drive Backup"
                        style={inputStyle}
                        onFocus={e=>e.target.style.borderColor=CLOUD_COLOR}
                        onBlur={e=>e.target.style.borderColor='var(--border)'}
                      />
                    </div>

                    <div style={{ marginTop:10, display:'flex', alignItems:'center', gap:6 }}>
                      <div style={{ width:6, height:6, borderRadius:'50%', background:CLOUD_COLOR, opacity:0.7 }}/>
                      <span style={{ fontSize:11, color:'var(--text-3)' }}>Sincronizzazione in uscita verso Drive · sola replica</span>
                    </div>
                  </div>
                );
              }

              const borderCol = hasError ? 'var(--danger)' : isMirror ? `${MIRROR_COLOR}40` : 'var(--border)';
              const bgCol = isMirror ? `${MIRROR_COLOR}06` : 'var(--surface)';

              return (
                <div style={{ background:bgCol, border:`1px solid ${borderCol}`, borderRadius:10, padding:'14px 16px', position:'relative', animation:'fadeUp 0.2s ease both', transition:'border-color 0.2s' }}>
                  {/* Card header */}
                  <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:12 }}>
                    <div style={{ width:22, height:22, borderRadius:6, background: isMirror ? `${MIRROR_COLOR}18` : 'oklch(0.65 0.14 200 / 0.12)', display:'flex', alignItems:'center', justifyContent:'center', color: isMirror ? MIRROR_COLOR : 'oklch(0.65 0.14 200)', flexShrink:0 }}>
                      <Icon name={isMirror ? 'mirror' : 'folder'} size={11}/>
                    </div>
                    <div style={{ display:'flex', alignItems:'center', gap:6, flex:1, minWidth:0 }}>
                      <span style={{ fontSize:12, fontWeight:600, color: isMirror ? MIRROR_COLOR : 'var(--text-2)' }}>
                        {isMirror ? 'Mirror Sink' : 'Sink'}
                      </span>
                      {isMirror && sourceSink && (
                        <span style={{ fontSize:11, color:'var(--text-3)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>
                          ↳ {sourceSink.label || sourceSink.path || 'Sink sorgente'}
                        </span>
                      )}
                    </div>
                    {/* Delete button */}
                    {(isMirror || normalSinks.length > 1 || mirrorSinks.filter(m => m.mirrorOf === sink.id).length === 0) && (
                      <button
                        onClick={() => removeSink(sink.id)}
                        title={hasError ? 'Rimuovi prima i mirror associati' : 'Elimina sink'}
                        style={{ marginLeft:'auto', background:'none', border:'none', cursor:'pointer', color: hasError ? 'var(--danger)' : 'var(--text-3)', display:'flex', padding:4, borderRadius:4, transition:'color 0.15s', flexShrink:0 }}
                        onMouseEnter={e=>e.currentTarget.style.color='var(--danger)'}
                        onMouseLeave={e=>e.currentTarget.style.color= hasError ? 'var(--danger)' : 'var(--text-3)'}
                      >
                        <Icon name="trash" size={13}/>
                      </button>
                    )}
                  </div>

                  {/* Error message */}
                  {hasError && (
                    <div style={{ marginBottom:10, padding:'7px 10px', borderRadius:7, background:'oklch(0.65 0.18 25 / 0.1)', border:'1px solid oklch(0.65 0.18 25 / 0.25)', fontSize:12, color:'var(--danger)', display:'flex', alignItems:'center', gap:7, animation:'fadeIn 0.2s ease both' }}>
                      <Icon name="info" size={12}/>
                      Questo sink ha mirror attivi. Rimuovili prima di eliminare la sorgente.
                    </div>
                  )}

                  {/* Fields */}
                  <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
                    <div>
                      <label style={{ display:'block', fontSize:11, color:'var(--text-3)', marginBottom:6, textTransform:'uppercase', letterSpacing:'0.04em' }}>
                        Directory Path <span style={{color:'var(--danger)'}}>*</span>
                      </label>
                      <div style={{ display:'flex', gap:6 }}>
                        <input
                          value={sink.path}
                          onChange={e => { updateSink(sink.id, 'path', e.target.value); markDirty(); }}
                          placeholder="/mnt/data/vault"
                          style={{ ...inputStyle, fontFamily:'monospace', fontSize:12, flex:1 }}
                          onFocus={e=>e.target.style.borderColor= isMirror ? MIRROR_COLOR : 'var(--accent)'}
                          onBlur={e=>e.target.style.borderColor='var(--border)'}
                        />
                        {!isMirror && (
                          <button
                            type="button"
                            onClick={() => setBrowserFor(sink.id)}
                            title="Browse server filesystem"
                            style={{ flexShrink:0, padding:'0 11px', borderRadius:8, background:'var(--surface2)', border:'1px solid var(--border2)', color:'var(--text-2)', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', transition:'all 0.15s' }}
                            onMouseEnter={e=>{ e.currentTarget.style.borderColor='var(--accent)'; e.currentTarget.style.color='var(--accent)'; }}
                            onMouseLeave={e=>{ e.currentTarget.style.borderColor='var(--border2)'; e.currentTarget.style.color='var(--text-2)'; }}
                          >
                            <Icon name="folderOpen" size={14}/>
                          </button>
                        )}
                      </div>
                    </div>
                    <div>
                      <label style={{ display:'block', fontSize:11, color:'var(--text-3)', marginBottom:6, textTransform:'uppercase', letterSpacing:'0.04em' }}>
                        Label <span style={{color:'var(--text-3)', fontWeight:400}}>(optional)</span>
                      </label>
                      <input
                        value={sink.label}
                        onChange={e => updateSink(sink.id, 'label', e.target.value)}
                        placeholder={isMirror ? 'es. Cold Mirror' : 'es. Primary Storage'}
                        style={inputStyle}
                        onFocus={e=>e.target.style.borderColor= isMirror ? MIRROR_COLOR : 'var(--accent)'}
                        onBlur={e=>e.target.style.borderColor='var(--border)'}
                      />
                    </div>
                  </div>

                  {/* Mirror sync info pill */}
                  {isMirror && (
                    <div style={{ marginTop:10, display:'flex', alignItems:'center', gap:6 }}>
                      <div style={{ width:6, height:6, borderRadius:'50%', background:MIRROR_COLOR, animation:'spin 2s linear infinite', opacity:0.8 }}/>
                      <span style={{ fontSize:11, color:MIRROR_COLOR }}>Sync bidirezionale attivo</span>
                    </div>
                  )}
                </div>
              );
            };

            return (
              <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
                {normalSinks.map(normal => {
                  const mirrors = mirrorSinks.filter(m => m.mirrorOf === normal.id);
                  return (
                    <div key={normal.id}>
                      <SinkCard sink={normal}/>
                      {mirrors.length > 0 && (
                        <div style={{ marginLeft:18, marginTop:6, display:'flex', gap:0 }}>
                          {/* Vertical connector line */}
                          <div style={{ width:18, flexShrink:0, position:'relative' }}>
                            {mirrors.map((_, mi) => (
                              <div key={mi} style={{ position:'absolute', left:8, top: mi === 0 ? 0 : `${mi * 100}%`, bottom: mi === mirrors.length - 1 ? '50%' : '0', borderLeft:`1.5px solid ${MIRROR_COLOR}40` }}/>
                            ))}
                            {mirrors.map((_, mi) => (
                              <div key={`h${mi}`} style={{ position:'absolute', left:8, top:`calc(${mi * (100/mirrors.length)}% + ${26 + mi * 12}px)`, width:10, borderTop:`1.5px solid ${MIRROR_COLOR}40` }}/>
                            ))}
                          </div>
                          <div style={{ flex:1, display:'flex', flexDirection:'column', gap:8 }}>
                            {mirrors.map(mirror => <SinkCard key={mirror.id} sink={mirror} isMirror/>)}
                          </div>
                        </div>
                      )}
                    </div>
                  );
                })}

                {/* Orphaned mirrors (mirrorOf references a deleted sink) */}
                {mirrorSinks.filter(m => !normalSinks.find(n => n.id === m.mirrorOf)).map(orphan => (
                  <div key={orphan.id} style={{ opacity:0.6 }}>
                    <SinkCard sink={orphan} isMirror/>
                  </div>
                ))}

                {/* Cloud sinks */}
                {cloudSinks.length > 0 && (
                  <div style={{ borderTop:'1px solid var(--border)', paddingTop:12, marginTop:4 }}>
                    <div style={{ fontSize:11, color:'var(--text-3)', textTransform:'uppercase', letterSpacing:'0.05em', marginBottom:10 }}>Cloud</div>
                    <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
                      {cloudSinks.map(cs => <SinkCard key={cs.id} sink={cs}/>)}
                    </div>
                  </div>
                )}
              </div>
            );
          })()}
        </section>

        {/* Divider */}
        <div style={{ height:1, background:'var(--border)', marginBottom:32 }}/>

        {/* Section: Engine */}
        <section style={{ marginBottom:32 }}>
          <h2 style={{ fontSize:14, fontWeight:600, marginBottom:4 }}>Engine</h2>
          <p style={{ fontSize:12, color:'var(--text-3)', marginBottom:16 }}>Configure how the vault engine processes your files.</p>

          <div style={{
            background:'var(--surface)', border:`1px solid ${squeezeMode ? 'oklch(0.65 0.14 290 / 0.4)' : 'var(--border)'}`,
            borderRadius:12, padding:'20px', transition:'border-color 0.2s',
          }}>
            <div style={{ display:'flex', alignItems:'flex-start', gap:14 }}>
              <div style={{
                width:40, height:40, borderRadius:10, flexShrink:0,
                background: squeezeMode ? 'oklch(0.65 0.14 290 / 0.15)' : 'var(--surface2)',
                border:`1px solid ${squeezeMode ? 'oklch(0.65 0.14 290 / 0.3)' : 'var(--border2)'}`,
                display:'flex', alignItems:'center', justifyContent:'center',
                transition:'all 0.2s', fontSize:18,
              }}>⚡</div>
              <div style={{ flex:1 }}>
                <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:5 }}>
                  <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                    <span style={{ fontSize:14, fontWeight:600 }}>Squeeze Mode</span>
                    {squeezeMode && <span style={{ fontSize:10, fontWeight:600, letterSpacing:'0.05em', textTransform:'uppercase', color:'oklch(0.65 0.14 290)', background:'oklch(0.65 0.14 290 / 0.1)', border:'1px solid oklch(0.65 0.14 290 / 0.25)', borderRadius:4, padding:'2px 7px' }}>Active</span>}
                  </div>
                  <button onClick={() => { setSqueezeMode(v => !v); markDirty(); }} style={{
                    width:44, height:24, borderRadius:12, border:'none', cursor:'pointer', flexShrink:0,
                    background: squeezeMode ? 'oklch(0.65 0.14 290)' : 'var(--border2)',
                    position:'relative', transition:'background 0.25s',
                  }}>
                    <div style={{
                      position:'absolute', top:3, left: squeezeMode ? 22 : 3,
                      width:18, height:18, borderRadius:'50%', background:'white',
                      transition:'left 0.25s', boxShadow:'0 1px 4px rgba(0,0,0,0.3)',
                    }}/>
                  </button>
                </div>
                <p style={{ fontSize:13, color:'var(--text-3)', lineHeight:1.6, marginBottom:10 }}>
                  Applies advanced multi-pass compression (LZ4+Zstd) to all stored files. Reduces storage footprint significantly, transparent to clients.
                </p>
                <div style={{ display:'flex', gap:20, opacity: squeezeMode ? 1 : 0.35, transition:'opacity 0.2s' }}>
                  {[['~40–65%','size reduction'],['LZ4+Zstd','algorithm'],['Transparent','to clients']].map(([v,l])=>(
                    <div key={l}>
                      <div style={{ fontSize:13, fontWeight:700, color: squeezeMode ? 'oklch(0.65 0.14 290)' : 'var(--text-2)' }}>{v}</div>
                      <div style={{ fontSize:11, color:'var(--text-3)' }}>{l}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </section>

        {/* Section: Users & Access */}
        {(() => {
          const PERM_OPTIONS = [
            { id:'full',  label:'Full',       color:'var(--accent)'        },
            { id:'write', label:'Read/Write', color:'oklch(0.65 0.14 145)' },
            { id:'read',  label:'Read Only',  color:'oklch(0.65 0.14 200)' },
            { id:'none',  label:'No Access',  color:'var(--text-3)'        },
          ];
          const ROLE_META = {
            owner:  { label:'Owner',  color:'oklch(0.72 0.14 78)'  },
            admin:  { label:'Admin',  color:'oklch(0.72 0.14 78)'  },
            member: { label:'Member', color:'oklch(0.65 0.14 145)' },
            viewer: { label:'Viewer', color:'oklch(0.65 0.14 200)' },
          };
          const normalSinks = sinks.filter(s => s.type !== 'mirror');
          const allUsers = [OWNER, ...users];

          function initials(name) {
            return name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
          }

          return (
            <section style={{ marginBottom:32 }}>
              <div style={{ height:1, background:'var(--border)', marginBottom:32 }}/>
              <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:16 }}>
                <div>
                  <h2 style={{ fontSize:14, fontWeight:600, marginBottom:2 }}>Utenti & Accesso</h2>
                  <p style={{ fontSize:12, color:'var(--text-3)' }}>Gestisci chi può accedere al vault e con quali permessi.</p>
                </div>
                <button
                  onClick={() => setInviteDialogOpen(true)}
                  style={{ display:'flex', alignItems:'center', gap:6, padding:'7px 13px', borderRadius:8, background:'var(--surface2)', border:'1px solid var(--border2)', color:'var(--text-2)', cursor:'pointer', fontSize:12, fontFamily:'var(--font-body)', transition:'all 0.15s', flexShrink:0 }}
                  onMouseEnter={e=>{ e.currentTarget.style.borderColor='var(--accent)'; e.currentTarget.style.color='var(--accent)'; }}
                  onMouseLeave={e=>{ e.currentTarget.style.borderColor='var(--border2)'; e.currentTarget.style.color='var(--text-2)'; }}
                >
                  <Icon name="plus" size={12}/>
                  Invita utente
                </button>
              </div>

              {/* User rows */}
              <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
                {allUsers.map(user => {
                  const meta    = ROLE_META[user.role] || ROLE_META.member;
                  const isOwner = user.role === 'owner';
                  const isOpen  = editPermUser === user.id;

                  return (
                    <div key={user.id} style={{ background:'var(--surface)', border:'1px solid var(--border)', borderRadius:10, overflow:'hidden', transition:'border-color 0.15s' }}>
                      {/* User header row */}
                      <div style={{ display:'flex', alignItems:'center', gap:12, padding:'12px 16px' }}>
                        {/* Avatar */}
                        <div style={{ width:34, height:34, borderRadius:'50%', background:`${meta.color}20`, border:`1px solid ${meta.color}40`, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
                          <span style={{ fontSize:12, fontWeight:700, color:meta.color }}>{initials(user.name)}</span>
                        </div>

                        {/* Info */}
                        <div style={{ flex:1, minWidth:0 }}>
                          <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:2 }}>
                            <span style={{ fontSize:13, fontWeight:600, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{user.name}</span>
                            <span style={{ fontSize:10, fontWeight:600, color:meta.color, background:`${meta.color}15`, padding:'2px 7px', borderRadius:4, flexShrink:0, textTransform:'uppercase', letterSpacing:'0.04em' }}>{meta.label}</span>
                            {isOwner && <span style={{ fontSize:10, color:'var(--text-3)', flexShrink:0 }}>· Non modificabile</span>}
                          </div>
                          <div style={{ fontSize:11, color:'var(--text-3)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{user.email}</div>
                        </div>

                        {/* Actions */}
                        {!isOwner && (
                          <div style={{ display:'flex', alignItems:'center', gap:6, flexShrink:0 }}>
                            <button
                              onClick={() => setEditPermUser(isOpen ? null : user.id)}
                              title="Modifica permessi"
                              style={{ padding:'5px 10px', borderRadius:6, background: isOpen ? 'var(--accent-dim)' : 'var(--surface2)', border:`1px solid ${isOpen ? 'var(--accent)' : 'var(--border2)'}`, color: isOpen ? 'var(--accent)' : 'var(--text-2)', fontSize:11, cursor:'pointer', fontFamily:'var(--font-body)', display:'flex', alignItems:'center', gap:5, transition:'all 0.15s' }}
                            >
                              <Icon name="settings" size={11}/>
                              Permessi
                            </button>
                            <button
                              onClick={() => { setUsers(u => u.filter(x => x.id !== user.id)); if(isOpen) setEditPermUser(null); }}
                              title="Elimina utente"
                              style={{ padding:6, borderRadius:6, background:'none', border:'1px solid transparent', color:'var(--text-3)', cursor:'pointer', display:'flex', transition:'all 0.15s' }}
                              onMouseEnter={e=>{ e.currentTarget.style.color='var(--danger)'; e.currentTarget.style.borderColor='oklch(0.65 0.18 25 / 0.3)'; e.currentTarget.style.background='oklch(0.65 0.18 25 / 0.08)'; }}
                              onMouseLeave={e=>{ e.currentTarget.style.color='var(--text-3)'; e.currentTarget.style.borderColor='transparent'; e.currentTarget.style.background='none'; }}
                            >
                              <Icon name="trash" size={13}/>
                            </button>
                          </div>
                        )}
                      </div>

                      {/* Permissions matrix (expanded) */}
                      {isOpen && !isOwner && (
                        <div style={{ borderTop:'1px solid var(--border)', padding:'14px 16px', background:'var(--surface2)', animation:'fadeIn 0.2s ease both' }}>
                          <div style={{ fontSize:11, color:'var(--text-3)', marginBottom:10, textTransform:'uppercase', letterSpacing:'0.04em' }}>Permessi per sink</div>
                          {normalSinks.length === 0 ? (
                            <p style={{ fontSize:12, color:'var(--text-3)', fontStyle:'italic' }}>Nessun sink normale configurato.</p>
                          ) : (
                            <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
                              {normalSinks.map(sink => {
                                const cur = user.permissions?.[sink.id] || 'none';
                                return (
                                  <div key={sink.id} style={{ display:'flex', alignItems:'center', gap:10 }}>
                                    <div style={{ display:'flex', alignItems:'center', gap:6, width:160, flexShrink:0 }}>
                                      <Icon name="folder" size={11} style={{color:'oklch(0.65 0.14 200)', flexShrink:0}}/>
                                      <span style={{ fontSize:12, color:'var(--text-2)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{sink.label || sink.path || `Sink #${sink.id}`}</span>
                                    </div>
                                    <div style={{ display:'flex', gap:4 }}>
                                      {PERM_OPTIONS.map(opt => {
                                        const active = cur === opt.id;
                                        return (
                                          <button
                                            key={opt.id}
                                            onClick={() => setUsers(us => us.map(u => u.id !== user.id ? u : { ...u, permissions: { ...u.permissions, [sink.id]: opt.id } }))}
                                            style={{ padding:'4px 10px', borderRadius:5, border: active ? `1px solid ${opt.color}` : '1px solid var(--border)', background: active ? `${opt.color}20` : 'var(--surface)', color: active ? opt.color : 'var(--text-3)', fontSize:10, fontWeight: active ? 600 : 400, cursor:'pointer', fontFamily:'var(--font-body)', transition:'all 0.12s', whiteSpace:'nowrap' }}
                                          >
                                            {opt.label}
                                          </button>
                                        );
                                      })}
                                    </div>
                                  </div>
                                );
                              })}
                            </div>
                          )}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>

              {/* Invite dialog */}
              {inviteDialogOpen && (
                <InviteUserDialog
                  normalSinks={normalSinks}
                  onConfirm={u => { setUsers(prev => [...prev, u]); setInviteDialogOpen(false); markDirty(); }}
                  onCancel={() => setInviteDialogOpen(false)}
                />
              )}
            </section>
          );
        })()}

        {/* Save button */}
        <div style={{ display:'flex', justifyContent:'flex-end', gap:10 }}>
          {dirty && <span style={{ fontSize:12, color:'var(--text-3)', alignSelf:'center' }}>Unsaved changes</span>}
          <button
            disabled={!canSave}
            onClick={() => { if(canSave){ onSave({ sinks, squeezeMode }); setDirty(false); } }}
            style={{
              padding:'10px 24px', borderRadius:8, border:'none',
              background: canSave ? 'var(--accent)' : 'var(--surface2)',
              color: canSave ? 'oklch(0.12 0.02 78)' : 'var(--text-3)',
              cursor: canSave ? 'pointer' : 'default',
              fontSize:13, fontWeight:600, fontFamily:'var(--font-body)',
              transition:'all 0.15s', display:'flex', alignItems:'center', gap:7,
            }}
          >
            <Icon name="check" size={14} style={{color: canSave ? 'oklch(0.12 0.02 78)' : 'var(--text-3)'}}/>
            Save Changes
          </button>
        </div>

      </div>

      {/* Server File Browser modal */}
      {browserFor !== null && (
        <ServerFileBrowser
          onSelect={path => { updateSink(browserFor, 'path', path); markDirty(); }}
          onClose={() => setBrowserFor(null)}
        />
      )}

      {/* Add Sink dialog */}
      {addDialogOpen && (
        <AddSinkDialog
          normalSinks={sinks.filter(s => s.type !== 'mirror')}
          onConfirm={handleAddSinkConfirm}
          onCancel={() => setAddDialogOpen(false)}
        />
      )}
    </div>
  );
}

// ── SQUEEZE VIEW ─────────────────────────────────────────────────────────────
const SQUEEZE_ALGORITHMS = ['LZ4+Zstd', 'Brotli', 'LZ4', 'Zstd', 'Deflate'];
const SQUEEZE_MOCK = MOCK_FILES.filter(f => !f.folder).map((f, i) => {
  const ratio = [0.38, 0.52, 0.61, 0.44, 0.29, 0.57, 0.63, 0.41, 0.55, 0.35][i % 10];
  return {
    ...f,
    algo: SQUEEZE_ALGORITHMS[i % SQUEEZE_ALGORITHMS.length],
    ratio,
    compressedSize: Math.round(f.size * ratio),
    savedBytes: Math.round(f.size * (1 - ratio)),
  };
});

function SqueezeView() {
  const [sortKey, setSortKey] = useState('ratio');
  const [sortDir, setSortDir] = useState('asc');

  const sq_color  = 'oklch(0.65 0.14 290)';
  const sq_bg     = 'oklch(0.65 0.14 290 / 0.10)';
  const sq_border = 'oklch(0.65 0.14 290 / 0.25)';

  function toggleSort(key) {
    if (sortKey === key) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setSortKey(key); setSortDir('asc'); }
  }

  const sorted = [...SQUEEZE_MOCK].sort((a, b) => {
    let av = a[sortKey], bv = b[sortKey];
    if (typeof av === 'string') { av = av.toLowerCase(); bv = bv.toLowerCase(); }
    return sortDir === 'asc' ? (av < bv ? -1 : av > bv ? 1 : 0) : (av > bv ? -1 : av < bv ? 1 : 0);
  });

  const totalOrig  = SQUEEZE_MOCK.reduce((s, f) => s + f.size, 0);
  const totalComp  = SQUEEZE_MOCK.reduce((s, f) => s + f.compressedSize, 0);
  const totalSaved = totalOrig - totalComp;
  const avgRatio   = SQUEEZE_MOCK.reduce((s, f) => s + f.ratio, 0) / SQUEEZE_MOCK.length;

  function SortArrow({ col }) {
    const active = sortKey === col;
    return (
      <svg viewBox="0 0 10 10" width="10" height="10" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"
        style={{ opacity: active ? 1 : 0.25, color: active ? sq_color : 'currentColor', transform: active && sortDir==='desc' ? 'rotate(180deg)' : 'none', transition:'transform 0.2s, opacity 0.15s', flexShrink:0 }}>
        <polyline points="2 4 5 7 8 4"/>
      </svg>
    );
  }

  function ColHead({ col, label, right }) {
    return (
      <div onClick={() => toggleSort(col)} style={{
        display:'flex', alignItems:'center', gap:4, cursor:'pointer', userSelect:'none',
        fontSize:11, textTransform:'uppercase', letterSpacing:'0.05em', fontWeight: sortKey===col ? 600 : 400,
        color: sortKey===col ? 'var(--text-2)' : 'var(--text-3)', transition:'color 0.15s',
        justifyContent: right ? 'flex-end' : 'flex-start',
      }}>
        {right && <SortArrow col={col}/>}{label}{!right && <SortArrow col={col}/>}
      </div>
    );
  }

  return (
    <div style={{ flex:1, overflowY:'auto', padding:'24px' }}>

      {/* Header */}
      <div style={{ marginBottom:20 }}>
        <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:4 }}>
          <div style={{ width:32, height:32, borderRadius:9, background:sq_bg, border:`1px solid ${sq_border}`, display:'flex', alignItems:'center', justifyContent:'center', color:sq_color }}>
            <Icon name="squeeze" size={16}/>
          </div>
          <h1 style={{ fontFamily:'var(--font-display)', fontSize:18, fontWeight:700, letterSpacing:'-0.02em' }}>Squeezed Files</h1>
          <span style={{ fontSize:10, fontWeight:600, letterSpacing:'0.06em', textTransform:'uppercase', color:sq_color, background:sq_bg, border:`1px solid ${sq_border}`, borderRadius:4, padding:'2px 8px' }}>⚡ Active</span>
        </div>
        <p style={{ fontSize:13, color:'var(--text-3)', marginLeft:42 }}>
          Files processed by Squeeze Mode — compression ratio, sizes and algorithm per file.
        </p>
      </div>

      {/* Summary stats */}
      <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:10, marginBottom:24 }}>
        {[
          { label:'Files Compressed', value: String(SQUEEZE_MOCK.length),  sub: null },
          { label:'Original Size',    value: fmtSize(totalOrig),           sub: null },
          { label:'Compressed Size',  value: fmtSize(totalComp),           sub: null },
          { label:'Space Saved',      value: fmtSize(totalSaved),          sub: `${((1-avgRatio)*100).toFixed(0)}% avg reduction` },
        ].map(stat => (
          <div key={stat.label} style={{ background:'var(--surface)', border:'1px solid var(--border)', borderRadius:10, padding:'14px 16px' }}>
            <div style={{ fontSize:11, color:'var(--text-3)', textTransform:'uppercase', letterSpacing:'0.05em', marginBottom:8 }}>{stat.label}</div>
            <div style={{ fontFamily:'var(--font-display)', fontSize:20, fontWeight:700, color: stat.label==='Space Saved' ? sq_color : 'var(--text)', marginBottom: stat.sub ? 4 : 0 }}>{stat.value}</div>
            {stat.sub && <div style={{ fontSize:11, color:sq_color, fontWeight:500 }}>{stat.sub}</div>}
          </div>
        ))}
      </div>

      {/* Table */}
      <div style={{ background:'var(--surface)', border:'1px solid var(--border)', borderRadius:12, overflow:'hidden' }}>
        {/* Header row */}
        <div style={{
          display:'grid', gridTemplateColumns:'32px 1fr 86px 100px 120px 130px 44px',
          padding:'10px 16px', borderBottom:'1px solid var(--border)', background:'var(--surface2)',
          gap:12, alignItems:'center',
        }}>
          <div/>
          <ColHead col="name"           label="Name"       />
          <ColHead col="size"           label="Original"   right />
          <ColHead col="compressedSize" label="Compressed" right />
          <ColHead col="ratio"          label="Ratio"      right />
          <ColHead col="algo"           label="Algorithm"  />
          <div/>
        </div>

        {/* Data rows */}
        {sorted.map((f, i) => {
          const ft = getFileType(f.name, false);
          const fc = FILE_COLORS[ft];
          const savePct = ((1 - f.ratio) * 100).toFixed(0);
          const barColor = f.ratio < 0.4 ? 'oklch(0.65 0.18 145)' : f.ratio < 0.55 ? sq_color : 'oklch(0.72 0.14 78)';

          return (
            <div key={f.id} style={{
              display:'grid', gridTemplateColumns:'32px 1fr 86px 100px 120px 130px 44px',
              padding:'11px 16px', borderBottom: i < sorted.length-1 ? '1px solid var(--border)' : 'none',
              alignItems:'center', gap:12, transition:'background 0.1s',
              animation:`fadeUp 0.3s ${i*25}ms both`,
            }}
            onMouseEnter={e=>e.currentTarget.style.background='var(--surface2)'}
            onMouseLeave={e=>e.currentTarget.style.background='transparent'}
            >
              <div style={{ color:fc }}><Icon name={ft} size={16}/></div>

              <div style={{ minWidth:0 }}>
                <div style={{ fontSize:13, fontWeight:500, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{f.name}</div>
                <div style={{ fontSize:11, color:'var(--text-3)', marginTop:1 }}>{fmtDate(f.modified)}</div>
              </div>

              <div style={{ fontSize:12, color:'var(--text-2)', textAlign:'right', fontFamily:'monospace' }}>{fmtSize(f.size)}</div>

              <div style={{ fontSize:12, color:sq_color, textAlign:'right', fontFamily:'monospace', fontWeight:500 }}>{fmtSize(f.compressedSize)}</div>

              <div style={{ display:'flex', flexDirection:'column', alignItems:'flex-end', gap:5 }}>
                <span style={{ fontSize:12, fontWeight:700, color:barColor }}>−{savePct}%</span>
                <div style={{ width:70, height:3, background:'var(--border)', borderRadius:2, overflow:'hidden' }}>
                  <div style={{ width:`${(1-f.ratio)*100}%`, height:'100%', background:barColor, borderRadius:2 }}/>
                </div>
              </div>

              <div>
                <span style={{
                  fontSize:11, fontFamily:'monospace', fontWeight:600,
                  color:sq_color, background:sq_bg, border:`1px solid ${sq_border}`,
                  borderRadius:5, padding:'3px 8px', whiteSpace:'nowrap',
                }}>{f.algo}</span>
              </div>

              <div style={{ display:'flex', justifyContent:'flex-end' }}>
                <button title="Download" style={{ background:'none', border:'none', cursor:'pointer', color:'var(--text-3)', display:'flex', padding:4, borderRadius:5, transition:'color 0.15s' }}
                  onMouseEnter={e=>e.currentTarget.style.color='var(--text)'}
                  onMouseLeave={e=>e.currentTarget.style.color='var(--text-3)'}
                ><Icon name="download" size={13}/></button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── CONFIRM DIALOG ───────────────────────────────────────────────
// Reusable confirmation dialog.
// Props:
//   variant      — 'danger' | 'warning' | 'info'   (default: 'danger')
//   icon         — Icon name string, or custom JSX  (default: variant icon)
//   title        — Dialog heading
//   message      — Body text (string or JSX)
//   detail       — Optional small secondary text below message
//   confirmLabel — Text on confirm button            (default: 'Confirm')
//   cancelLabel  — Text on cancel button             (default: 'Cancel')
//   onConfirm    — () => void
//   onCancel     — () => void
function ConfirmDialog({
  variant = 'danger',
  icon,
  title,
  message,
  detail,
  confirmLabel = 'Confirm',
  cancelLabel  = 'Cancel',
  onConfirm,
  onCancel,
}) {
  // Close on Escape
  React.useEffect(() => {
    const handler = (e) => { if (e.key === 'Escape') onCancel(); };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, []);

  const VARIANT = {
    danger:  { color: 'oklch(0.65 0.18 25)',  bg: 'oklch(0.65 0.18 25 / 0.10)',  border: 'oklch(0.65 0.18 25 / 0.28)',  btnBg: 'oklch(0.65 0.18 25)',  btnText: 'oklch(0.98 0.01 25)',  defaultIcon: 'trash'    },
    warning: { color: 'oklch(0.72 0.14 78)',   bg: 'oklch(0.72 0.14 78 / 0.10)',  border: 'oklch(0.72 0.14 78 / 0.28)',  btnBg: 'oklch(0.72 0.14 78)',  btnText: 'oklch(0.12 0.02 78)', defaultIcon: 'info'     },
    info:    { color: 'oklch(0.65 0.14 200)',  bg: 'oklch(0.65 0.14 200 / 0.10)', border: 'oklch(0.65 0.14 200 / 0.28)', btnBg: 'oklch(0.65 0.14 200)', btnText: 'oklch(0.10 0.02 200)',defaultIcon: 'info'     },
  };
  const v = VARIANT[variant] || VARIANT.danger;
  const resolvedIcon = icon || v.defaultIcon;

  return (
    <div
      style={{
        position: 'fixed', inset: 0, zIndex: 1000,
        background: 'rgba(0,0,0,0.65)', backdropFilter: 'blur(5px)',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        animation: 'fadeIn 0.15s ease both',
      }}
      onClick={e => { if (e.target === e.currentTarget) onCancel(); }}
    >
      <div style={{
        width: 420, background: 'var(--surface)',
        border: `1px solid ${v.border}`,
        borderRadius: 16, overflow: 'hidden',
        boxShadow: `0 0 0 1px ${v.bg}, 0 24px 80px rgba(0,0,0,0.6)`,
        animation: 'scaleIn 0.2s cubic-bezier(0.22,1,0.36,1) both',
      }}>

        {/* Top accent bar */}
        <div style={{ height: 3, background: v.color, opacity: 0.7 }}/>

        {/* Body */}
        <div style={{ padding: '28px 28px 24px' }}>
          {/* Icon + title */}
          <div style={{ display: 'flex', alignItems: 'flex-start', gap: 16, marginBottom: 16 }}>
            <div style={{
              width: 44, height: 44, borderRadius: 12, flexShrink: 0,
              background: v.bg, border: `1px solid ${v.border}`,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              color: v.color,
            }}>
              {typeof resolvedIcon === 'string'
                ? <Icon name={resolvedIcon} size={22}/>
                : resolvedIcon
              }
            </div>
            <div style={{ paddingTop: 2 }}>
              <h2 style={{
                fontFamily: 'var(--font-display)', fontSize: 17, fontWeight: 700,
                letterSpacing: '-0.02em', color: 'var(--text)', marginBottom: 6,
              }}>{title}</h2>
              <p style={{ fontSize: 13, color: 'var(--text-2)', lineHeight: 1.6 }}>{message}</p>
              {detail && (
                <p style={{
                  fontSize: 12, color: 'var(--text-3)', lineHeight: 1.55,
                  marginTop: 10, padding: '9px 12px',
                  background: 'var(--surface2)', border: '1px solid var(--border)',
                  borderRadius: 8, fontFamily: 'monospace',
                }}>{detail}</p>
              )}
            </div>
          </div>
        </div>

        {/* Footer */}
        <div style={{
          padding: '14px 28px 20px',
          display: 'flex', justifyContent: 'flex-end', gap: 10,
          borderTop: '1px solid var(--border)',
          background: 'var(--surface2)',
        }}>
          <button
            onClick={onCancel}
            autoFocus
            style={{
              padding: '9px 20px', borderRadius: 8,
              border: '1px solid var(--border2)', background: 'transparent',
              color: 'var(--text-2)', cursor: 'pointer', fontSize: 13,
              fontFamily: 'var(--font-body)', fontWeight: 500,
              transition: 'all 0.15s',
            }}
            onMouseEnter={e => e.currentTarget.style.background = 'var(--surface)'}
            onMouseLeave={e => e.currentTarget.style.background = 'transparent'}
          >{cancelLabel}</button>
          <button
            onClick={onConfirm}
            style={{
              padding: '9px 20px', borderRadius: 8, border: 'none',
              background: v.btnBg, color: v.btnText,
              cursor: 'pointer', fontSize: 13, fontFamily: 'var(--font-body)',
              fontWeight: 600, transition: 'opacity 0.15s',
              display: 'flex', alignItems: 'center', gap: 7,
            }}
            onMouseEnter={e => e.currentTarget.style.opacity = '0.85'}
            onMouseLeave={e => e.currentTarget.style.opacity = '1'}
          >
            {typeof resolvedIcon === 'string'
              ? <Icon name={resolvedIcon} size={13} style={{ color: v.btnText }}/>
              : null
            }
            {confirmLabel}
          </button>
        </div>
      </div>
    </div>
  );
}
