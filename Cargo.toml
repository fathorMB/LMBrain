[workspace]
resolver = "2"
members = ["src-tauri", "lmbrain-core", "lmbrain-mcp"]

[workspace.package]
edition = "2021"
rust-version = "1.77.2"

[workspace.dependencies]
lmbrain-core = { path = "lmbrain-core" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = { version = "1.1", default-features = false, features = ["deserialize"] }
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
toml_edit = "0.22"
regex = "1"
fs2 = "0.4"
libc = "0.2"
tempfile = "3"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
once_cell = "1"
semver = "1.0"
glob = "0.3"
ts-rs = { version = "10.1", features = ["serde-compat"] }
